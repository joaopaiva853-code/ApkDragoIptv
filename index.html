<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barbearia Old School - Sistema Completo</title>
    <style>
        :root {
            --bg: #111;
            --bg2: #1a1a1a;
            --card: #1e1e1e;
            --gold: #c8a45c;
            --gold2: #d4b06a;
            --text: #e0e0e0;
            --muted: #999;
            --border: #333;
            --danger: #e74c3c;
            --success: #2ecc71;
            --blue: #3498db;
            --radius: 12px;
            --shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }
        .app {
            width: 100%;
            max-width: 1300px;
            background: var(--bg2);
            border-radius: 20px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            min-height: 90vh;
            overflow: hidden;
        }

        /* HEADER */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 24px;
            border-bottom: 1px solid var(--border);
            background: #1c1c1c;
            flex-wrap: wrap;
            gap: 12px;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }
        .logo-icon {
            width: 42px;
            height: 42px;
            background: var(--gold);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: #111;
            font-weight: 900;
        }
        .logo-text h2 {
            font-size: 1.2rem;
            color: #fff;
            letter-spacing: 1px;
        }
        .logo-text span {
            font-size: 0.7rem;
            color: var(--gold);
            letter-spacing: 2px;
        }
        .nav-btns {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .btn {
            padding: 10px 20px;
            border-radius: 25px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            border: none;
            transition: 0.2s;
            letter-spacing: 0.5px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-family: inherit;
        }
        .btn-gold {
            background: var(--gold);
            color: #111;
        }
        .btn-gold:hover {
            background: var(--gold2);
            transform: translateY(-2px);
        }
        .btn-outline {
            background: transparent;
            border: 2px solid var(--border);
            color: var(--text);
        }
        .btn-outline:hover {
            border-color: var(--gold);
            color: #fff;
        }
        .btn-sm {
            padding: 6px 14px;
            font-size: 0.78rem;
            border-radius: 18px;
        }
        .btn-danger {
            background: var(--danger);
            color: #fff;
        }
        .btn-success {
            background: var(--success);
            color: #fff;
        }
        .btn-blue {
            background: var(--blue);
            color: #fff;
        }

        /* MAIN CONTENT */
        .main {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        /* SIDEBAR ADMIN */
        .sidebar {
            width: 220px;
            background: #181818;
            border-right: 1px solid var(--border);
            padding: 16px 0;
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex-shrink: 0;
        }
        .sidebar a {
            padding: 12px 20px;
            color: var(--muted);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            transition: 0.2s;
            border-left: 3px solid transparent;
            cursor: pointer;
        }
        .sidebar a:hover,
        .sidebar a.active {
            color: #fff;
            background: #222;
            border-left-color: var(--gold);
        }
        .content-area {
            flex: 1;
            padding: 20px 24px;
            overflow-y: auto;
            max-height: 70vh;
        }

        /* CARDS */
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 16px;
        }
        .card h3 {
            color: #fff;
            margin-bottom: 12px;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        .grid-3 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }
        .grid-4 {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }
        @media (max-width: 800px) {
            .grid-2,
            .grid-3,
            .grid-4 {
                grid-template-columns: 1fr 1fr;
            }
            .sidebar {
                width: 60px;
            }
            .sidebar a span {
                display: none;
            }
            .sidebar a {
                justify-content: center;
                padding: 12px;
            }
        }
        @media (max-width: 500px) {
            .grid-2,
            .grid-3,
            .grid-4 {
                grid-template-columns: 1fr;
            }
            .sidebar {
                display: none;
            }
        }

        /* TABLE */
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
        }
        th,
        td {
            padding: 10px 12px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }
        th {
            color: var(--gold);
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.7rem;
            letter-spacing: 1px;
        }
        tr:hover {
            background: #222;
        }

        /* FORM */
        input,
        select,
        textarea {
            width: 100%;
            background: #2a2a2a;
            border: 2px solid var(--border);
            border-radius: 8px;
            padding: 10px 14px;
            color: #fff;
            font-size: 0.9rem;
            font-family: inherit;
            outline: none;
            transition: 0.2s;
        }
        input:focus,
        select:focus,
        textarea:focus {
            border-color: var(--gold);
        }
        label {
            font-weight: 600;
            font-size: 0.8rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: block;
            margin-bottom: 4px;
        }
        .form-group {
            margin-bottom: 12px;
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        /* MODAL */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            animation: fadeIn 0.2s;
        }
        .modal {
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            width: 90%;
            max-width: 500px;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: var(--shadow);
        }
        .modal h2 {
            color: #fff;
            margin-bottom: 16px;
        }
        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 16px;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        /* TAGS */
        .tag {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        .tag-confirmed {
            background: #1a3a2a;
            color: var(--success);
        }
        .tag-pending {
            background: #3a2a1a;
            color: var(--gold);
        }
        .tag-cancelled {
            background: #3a1a1a;
            color: var(--danger);
        }

        .hidden {
            display: none !important;
        }
        .text-center {
            text-align: center;
        }
        .mb-16 {
            margin-bottom: 16px;
        }
        .mt-16 {
            margin-top: 16px;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #333;
            color: #fff;
            padding: 12px 24px;
            border-radius: 30px;
            font-weight: 600;
            z-index: 200;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
            animation: slideUp 0.3s ease;
            pointer-events: none;
        }
        @keyframes slideUp {
            from {
                transform: translateX(-50%) translateY(20px);
                opacity: 0;
            }
            to {
                transform: translateX(-50%) translateY(0);
                opacity: 1;
            }
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
        }
        .status-active {
            background: #1a3a2a;
            color: var(--success);
        }
        .status-inactive {
            background: #3a1a1a;
            color: var(--danger);
        }
    </style>
</head>
<body>
    <div class="app" id="appRoot">
        <!-- HEADER -->
        <header class="header">
            <div class="logo" onclick="navegar('cliente')">
                <div class="logo-icon">✂</div>
                <div class="logo-text">
                    <h2>OLD SCHOOL</h2>
                    <span>Barbearia</span>
                </div>
            </div>
            <div class="nav-btns">
                <button class="btn btn-outline btn-sm" onclick="navegar('cliente')">👤 Área do Cliente</button>
                <button class="btn btn-gold btn-sm" onclick="navegar('admin')">⚙️ Administração</button>
            </div>
        </header>

        <!-- MAIN AREA -->
        <div class="main" id="mainContainer">
            <!-- Conteúdo dinâmico renderizado por JS -->
        </div>
    </div>

    <!-- TOAST -->
    <div id="toast" class="toast hidden"></div>

    <!-- MODAL CONTAINER -->
    <div id="modalContainer"></div>

    <script>
        (() => {
            // ========== DADOS INICIAIS ==========
            const DEFAULT_DATA = {
                servicos: [
                    { id: 'c1', nome: 'Corte Clássico', icone: '💈', preco: 55, duracao: 30, ativo: true },
                    { id: 'c2', nome: 'Degradê', icone: '🔥', preco: 65, duracao: 40, ativo: true },
                    { id: 'c3', nome: 'Barba', icone: '🧔', preco: 40, duracao: 25, ativo: true },
                    { id: 'c4', nome: 'Barba + Navalha', icone: '🪒', preco: 55, duracao: 35, ativo: true },
                    { id: 'c5', nome: 'Combo Corte + Barba', icone: '⭐', preco: 90, duracao: 55, ativo: true },
                    { id: 'c6', nome: 'Hidratação', icone: '💆', preco: 70, duracao: 30, ativo: true },
                    { id: 'c7', nome: 'Sobrancelha', icone: '✂️', preco: 20, duracao: 10, ativo: true },
                ],
                barbeiros: [
                    { id: 'b1', nome: 'Marcos', avatar: '🧔‍♂️', especialidade: 'Cortes Clássicos', ativo: true },
                    { id: 'b2', nome: 'Lucas', avatar: '💇‍♂️', especialidade: 'Degradê & Moderno', ativo: true },
                    { id: 'b3', nome: 'Pedro', avatar: '🪒', especialidade: 'Barba & Navalha', ativo: true },
                    { id: 'b4', nome: 'André', avatar: '🎯', especialidade: 'Todos os estilos', ativo: true },
                ],
                agendamentos: [],
                config: {
                    horaAbertura: '09:00',
                    horaFechamento: '20:00',
                    intervaloMinutos: 30,
                    diasFolga: [0], // 0=domingo
                    senhaAdmin: 'admin123',
                }
            };

            // ========== PERSISTÊNCIA ==========
            function carregarDados() {
                const raw = localStorage.getItem('barbearia_data');
                if (raw) {
                    try {
                        return JSON.parse(raw);
                    } catch (e) {}
                }
                return JSON.parse(JSON.stringify(DEFAULT_DATA));
            }

            function salvarDados(data) {
                localStorage.setItem('barbearia_data', JSON.stringify(data));
            }

            let DATA = carregarDados();

            // Garantir IDs únicos
            function gerarId() {
                return 'id_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
            }

            // ========== ESTADO DA UI ==========
            let paginaAtual = 'cliente'; // 'cliente' | 'admin' | 'admin_login'
            let secaoAdmin = 'dashboard'; // dashboard | servicos | barbeiros | agendamentos | config
            let adminLogado = false;

            // Estado do agendamento (cliente)
            let state = {
                step: 1,
                selectedService: null,
                selectedBarber: null,
                selectedDate: null,
                selectedTime: null,
                nome: '',
                telefone: '',
                email: '',
                obs: '',
            };

            // ========== RENDER PRINCIPAL ==========
            const $main = document.getElementById('mainContainer');
            const $modal = document.getElementById('modalContainer');
            const $toast = document.getElementById('toast');

            function toast(msg) {
                $toast.textContent = msg;
                $toast.classList.remove('hidden');
                setTimeout(() => $toast.classList.add('hidden'), 2500);
            }

            function navegar(destino) {
                if (destino === 'admin' && !adminLogado) {
                    paginaAtual = 'admin_login';
                } else if (destino === 'admin' && adminLogado) {
                    paginaAtual = 'admin';
                    secaoAdmin = 'dashboard';
                } else if (destino === 'cliente') {
                    paginaAtual = 'cliente';
                    state = { step: 1, selectedService: null, selectedBarber: null, selectedDate: null,
                        selectedTime: null, nome: '', telefone: '', email: '', obs: '' };
                }
                render();
            }

            function loginAdmin(senha) {
                if (senha === DATA.config.senhaAdmin) {
                    adminLogado = true;
                    paginaAtual = 'admin';
                    secaoAdmin = 'dashboard';
                    render();
                    toast('✅ Login realizado com sucesso!');
                } else {
                    toast('❌ Senha incorreta!');
                }
            }

            function logoutAdmin() {
                adminLogado = false;
                paginaAtual = 'cliente';
                render();
            }

            // ========== RENDER COMPLETO ==========
            function render() {
                if (paginaAtual === 'cliente') {
                    renderCliente();
                } else if (paginaAtual === 'admin_login') {
                    renderLoginAdmin();
                } else if (paginaAtual === 'admin') {
                    renderAdmin();
                }
            }

            // ========== ÁREA CLIENTE ==========
            function renderCliente() {
                let html = '';
                if (state.step === 1) html = renderStep1();
                else if (state.step === 2) html = renderStep2();
                else if (state.step === 3) html = renderStep3();
                else if (state.step === 4) html = renderStep4();
                else if (state.step === 5) html = renderStep5();
                else if (state.step === 6) html = renderStepConfirmado();
                $main.innerHTML = html;
                if (state.step === 3) {
                    renderizarHorarios();
                }
                if (state.step === 5) {
                    preencherResumo();
                }
            }

            function servicosAtivos() {
                return DATA.servicos.filter(s => s.ativo);
            }

            function barbeirosAtivos() {
                return DATA.barbeiros.filter(b => b.ativo);
            }

            function renderStep1() {
                const servicos = servicosAtivos();
                return `
              <div style="padding:20px;">
                <h3 style="color:#fff;margin-bottom:16px;">1️⃣ Escolha o serviço</h3>
                <div class="grid-3">
                  ${servicos.map(s => `
                    <div class="card" style="cursor:pointer;text-align:center;border:2px solid ${state.selectedService===s.id?'var(--gold)':'var(--border)'};" 
                         onclick="selectService('${s.id}')">
                      <div style="font-size:2rem;">${s.icone}</div>
                      <div style="font-weight:700;color:#fff;">${s.nome}</div>
                      <div style="color:var(--gold);font-weight:700;">R$ ${s.preco.toFixed(2)}</div>
                      <div style="color:var(--muted);font-size:0.8rem;">⏱ ${s.duracao} min</div>
                      ${state.selectedService===s.id?'<div style="color:var(--gold);margin-top:6px;">✓ Selecionado</div>':''}
                    </div>
                  `).join('')}
                </div>
                <div style="margin-top:16px;text-align:right;">
                  <button class="btn btn-gold" ${!state.selectedService?'disabled':''} onclick="nextStep()">Próximo →</button>
                </div>
              </div>`;
            }

            function renderStep2() {
                const barbeiros = barbeirosAtivos();
                return `
              <div style="padding:20px;">
                <h3 style="color:#fff;margin-bottom:16px;">2️⃣ Escolha o barbeiro</h3>
                <div class="grid-3">
                  ${barbeiros.map(b => `
                    <div class="card" style="cursor:pointer;text-align:center;border:2px solid ${state.selectedBarber===b.id?'var(--gold)':'var(--border)'};"
                         onclick="selectBarber('${b.id}')">
                      <div style="font-size:2.5rem;">${b.avatar}</div>
                      <div style="font-weight:700;color:#fff;">${b.nome}</div>
                      <div style="color:var(--muted);font-size:0.8rem;">${b.especialidade}</div>
                      ${state.selectedBarber===b.id?'<div style="color:var(--gold);margin-top:6px;">✓ Selecionado</div>':''}
                    </div>
                  `).join('')}
                </div>
                <div style="margin-top:16px;display:flex;justify-content:space-between;">
                  <button class="btn btn-outline" onclick="prevStep()">← Voltar</button>
                  <button class="btn btn-gold" ${!state.selectedBarber?'disabled':''} onclick="nextStep()">Próximo →</button>
                </div>
              </div>`;
            }

            function gerarDatas() {
                const datas = [];
                const hoje = new Date();
                for (let i = 1; i <= 14; i++) {
                    const d = new Date(hoje);
                    d.setDate(d.getDate() + i);
                    if (DATA.config.diasFolga.includes(d.getDay())) continue;
                    datas.push({
                        iso: d.toISOString().split('T')[0],
                        diaSemana: d.toLocaleDateString('pt-BR', { weekday: 'short' }).replace('.', ''),
                        dia: d.getDate(),
                        mes: d.toLocaleDateString('pt-BR', { month: 'short' }).replace('.', ''),
                    });
                }
                return datas.slice(0, 12);
            }

            function gerarHorariosDisponiveis(dataIso) {
                const todos = [];
                const [hA, mA] = DATA.config.horaAbertura.split(':').map(Number);
                const [hF, mF] = DATA.config.horaFechamento.split(':').map(Number);
                const inicio = hA * 60 + mA;
                const fim = hF * 60 + mF;
                const intervalo = DATA.config.intervaloMinutos;
                for (let m = inicio; m < fim; m += intervalo) {
                    const hh = String(Math.floor(m / 60)).padStart(2, '0');
                    const mm = String(m % 60).padStart(2, '0');
                    todos.push(`${hh}:${mm}`);
                }
                // Remover horários já agendados para esta data
                const ocupados = DATA.agendamentos
                    .filter(a => a.data === dataIso && a.status !== 'cancelado')
                    .map(a => a.hora);
                return todos.filter(t => !ocupados.includes(t));
            }

            function renderStep3() {
                const datas = gerarDatas();
                return `
              <div style="padding:20px;">
                <h3 style="color:#fff;margin-bottom:12px;">3️⃣ Escolha a data</h3>
                <div class="grid-4" id="dateGridClient">
                  ${datas.map(d => `
                    <button class="btn ${state.selectedDate===d.iso?'btn-gold':'btn-outline'} btn-sm" 
                            style="flex-direction:column;gap:2px;padding:10px;"
                            onclick="selectDate('${d.iso}')">
                      <span style="font-size:0.65rem;text-transform:uppercase;">${d.diaSemana}</span>
                      <span style="font-size:1.3rem;font-weight:900;">${d.dia}</span>
                      <span style="font-size:0.65rem;">${d.mes}</span>
                    </button>
                  `).join('')}
                </div>
                <h3 style="color:#fff;margin:16px 0 8px;">🕐 Horário</h3>
                <div class="grid-4" id="timeGridClient">
                  <p style="color:var(--muted);grid-column:1/-1;">Selecione uma data primeiro</p>
                </div>
                <div style="margin-top:16px;display:flex;justify-content:space-between;">
                  <button class="btn btn-outline" onclick="prevStep()">← Voltar</button>
                  <button class="btn btn-gold" id="btnStep3" ${!state.selectedDate||!state.selectedTime?'disabled':''} onclick="nextStep()">Próximo →</button>
                </div>
              </div>`;
            }

            function renderizarHorarios() {
                const container = document.getElementById('timeGridClient');
                if (!container) return;
                if (!state.selectedDate) {
                    container.innerHTML =
                        '<p style="color:var(--muted);grid-column:1/-1;">Selecione uma data primeiro</p>';
                    return;
                }
                const horarios = gerarHorariosDisponiveis(state.selectedDate);
                if (horarios.length === 0) {
                    container.innerHTML =
                        '<p style="color:var(--danger);grid-column:1/-1;">Nenhum horário disponível nesta data.</p>';
                } else {
                    container.innerHTML = horarios.map(h => `
                <button class="btn ${state.selectedTime===h?'btn-gold':'btn-outline'} btn-sm"
                        onclick="selectTime('${h}')">${h}</button>
              `).join('');
                }
                document.getElementById('btnStep3').disabled = !(state.selectedDate && state.selectedTime);
            }

            function renderStep4() {
                return `
              <div style="padding:20px;max-width:550px;">
                <h3 style="color:#fff;margin-bottom:16px;">4️⃣ Seus dados</h3>
                <div class="form-row">
                  <div class="form-group"><label>Nome completo *</label><input id="inpNome" value="${state.nome}" placeholder="Seu nome"></div>
                  <div class="form-group"><label>Telefone *</label><input id="inpTel" value="${state.telefone}" placeholder="(11) 99999-9999"></div>
                </div>
                <div class="form-group"><label>E-mail</label><input id="inpEmail" value="${state.email}" placeholder="opcional@email.com"></div>
                <div class="form-group"><label>Observação</label><textarea id="inpObs" rows="2">${state.obs}</textarea></div>
                <div style="display:flex;justify-content:space-between;margin-top:16px;">
                  <button class="btn btn-outline" onclick="prevStep()">← Voltar</button>
                  <button class="btn btn-gold" onclick="validarDados()">Próximo →</button>
                </div>
              </div>`;
            }

            function validarDados() {
                const nome = document.getElementById('inpNome').value.trim();
                const tel = document.getElementById('inpTel').value.trim();
                if (!nome) return toast('⚠️ Informe seu nome.');
