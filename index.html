<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Gestão IPTV Pro">
    <link rel="manifest" href="data:application/manifest+json,{
        %22name%22:%22Gest%C3%A3o%20IPTV%20Pro%22,
        %22short_name%22:%22IPTV%20Gest%C3%A3o%22,
        %22start_url%22:%22.%22,
        %22display%22:%22standalone%22,
        %22theme_color%22:%22%230f172a%22,
        %22background_color%22:%22%230f172a%22,
        %22icons%22:[
            {%22src%22:%22https://cdn-icons-png.flaticon.com/512/1183/1183672.png%22,%22sizes%22:%22192x192%22,%22type%22:%22image/png%22},
            {%22src%22:%22https://cdn-icons-png.flaticon.com/512/1183/1183672.png%22,%22sizes%22:%22512x512%22,%22type%22:%22image/png%22}
        ]
    }">
    <title>Gestão IPTV Pro | Sistema Completo</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: radial-gradient(circle at 10% 20%, #0a0f2a, #0b1120);
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', 'Helvetica Neue', sans-serif;
            height: 100vh;
            overflow: hidden;
            position: fixed;
            width: 100%;
        }

        @import url('https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap');

        .app-wrapper {
            display: flex;
            flex-direction: column;
            height: 100%;
            width: 100%;
            max-width: 560px;
            margin: 0 auto;
            background: transparent;
            position: relative;
        }

        /* Header sem banner */
        .app-header {
            background: linear-gradient(145deg, rgba(99, 102, 241, 0.9), rgba(139, 92, 246, 0.9), rgba(236, 72, 153, 0.85));
            backdrop-filter: blur(12px);
            padding: 22px 18px 20px;
            border-radius: 0 0 40px 40px;
            color: white;
            text-align: center;
            box-shadow: 0 15px 35px -10px rgba(0, 0, 0, 0.3);
            flex-shrink: 0;
            border-bottom: 1px solid rgba(255,255,255,0.2);
        }
        .app-header h1 {
            font-size: 1.6rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            letter-spacing: -0.5px;
        }

        .view-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px 16px 24px;
            scroll-behavior: smooth;
        }

        .bottom-nav {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255,255,255,0.1);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 8px 12px 14px;
            border-radius: 36px 36px 0 0;
            flex-shrink: 0;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            background: transparent;
            border: none;
            padding: 8px 16px;
            border-radius: 40px;
            cursor: pointer;
            transition: all 0.2s;
            color: #94a3b8;
            font-size: 0.7rem;
            font-weight: 600;
        }
        .nav-item i { font-size: 1.5rem; }
        .nav-item.active {
            background: linear-gradient(145deg, #3b82f6, #8b5cf6);
            color: white;
            box-shadow: 0 8px 20px -5px rgba(59,130,246,0.4);
            transform: translateY(-2px);
        }

        /* Cards das métricas lado a lado */
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
            margin-bottom: 20px;
        }
        .metric-card {
            background: linear-gradient(145deg, rgba(255,255,255,0.96), rgba(248,250,252,0.92));
            border-radius: 28px;
            padding: 14px;
            box-shadow: 0 15px 30px -12px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255,255,255,0.6);
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 6px solid;
        }
        .metric-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.25);
        }
        .metric-value {
            font-size: 1.6rem;
            font-weight: 800;
            background: linear-gradient(145deg, #0f172a, #1e293b);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            line-height: 1.2;
        }
        .metric-title {
            font-size: 0.7rem;
            font-weight: 600;
            color: #475569;
            display: flex;
            align-items: center;
            gap: 5px;
            margin-bottom: 4px;
        }
        .metric-icon {
            font-size: 1.8rem;
            opacity: 0.7;
        }

        @media (max-width: 420px) {
            .metrics-grid {
                grid-template-columns: 1fr;
                gap: 12px;
            }
        }

        /* Demais cards */
        .section-card, .plan-card, .alert-card-mobile {
            background: linear-gradient(145deg, rgba(255,255,255,0.96), rgba(248,250,252,0.92));
            border-radius: 32px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 15px 30px -12px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255,255,255,0.6);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .actions-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin: 16px 0 8px;
        }
        .action-card-btn {
            background: rgba(255,255,255,0.9);
            border-radius: 34px;
            padding: 14px 6px;
            text-align: center;
            font-weight: 600;
            border: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-primary-card { background: linear-gradient(95deg, #2563eb, #7c3aed); color: white; }
        .btn-whatsapp-card { background: linear-gradient(95deg, #25D366, #128C7E); color: white; }
        .btn-danger-card { background: linear-gradient(95deg, #dc2626, #ef4444); color: white; }

        /* CLIENTES - CARDS COM LETRAS MAIORES */
        .clients-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 18px;
            align-items: start;
        }
        .client-card {
            background: white;
            border-radius: 32px;
            padding: 20px 18px;
            transition: all 0.2s;
            box-shadow: 0 12px 25px -10px rgba(0, 0, 0, 0.15);
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        .client-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.2);
        }
        .client-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .client-name {
            font-weight: 800;
            font-size: 1.25rem;
            display: flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(145deg, #0f172a, #312e81);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            word-break: break-word;
        }
        .status-badge {
            padding: 6px 14px;
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: 700;
            white-space: nowrap;
        }
        .status-active { background: #dcfce7; color: #15803d; }
        .status-expired { background: #fee2e2; color: #b91c1c; }
        .status-warning { background: #fed7aa; color: #c2410c; }

        .client-details {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin: 16px 0;
            font-size: 0.9rem;
            color: #1f2937;
        }
        .client-details span {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            word-break: break-word;
            font-size: 0.95rem;
        }
        .client-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: flex-start;
            margin-top: auto;
            border-top: 1px solid #eef2ff;
            padding-top: 16px;
        }
        .client-action-icon {
            background: rgba(0,0,0,0.04);
            padding: 10px 14px;
            border-radius: 40px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: 0.15s;
            flex: 1;
            justify-content: center;
        }
        .client-action-icon:active {
            background: rgba(0,0,0,0.1);
            transform: scale(0.97);
        }

        .chart-wrapper { height: 210px; margin-top: 12px; }
        .hidden { display: none; }
        input, select {
            width: 100%;
            padding: 14px 16px;
            border-radius: 34px;
            border: 1px solid #e2e8f0;
            background: white;
            margin-bottom: 12px;
            font-size: 0.9rem;
        }
        .double-btns { display: flex; gap: 12px; margin-top: 8px; }
        .plan-card { background: linear-gradient(135deg, #fffbeb, #fef9c3); }
        .alert-card-mobile {
            background: linear-gradient(115deg, #fff9e6, #fef3c7);
            border-left: 6px solid #f59e0b;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        .alert-expired { background: linear-gradient(115deg, #fef2f2, #fee2e2); border-left-color: #dc2626; }
        footer { font-size: 0.65rem; text-align: center; color: #64748b; margin-top: 24px; }
        .section-title {
            font-weight: 800;
            margin-bottom: 16px;
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            gap: 10px;
            background: linear-gradient(145deg, #0f172a, #312e81);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }
        button { cursor: pointer; font-family: 'Inter', sans-serif; }
    </style>
</head>
<body>
<div class="app-wrapper">
    <div class="app-header">
        <h1><i class="fas fa-tv"></i> GESTÃO IPTV PRO</h1>
    </div>
    <div id="viewContainer" class="view-container"></div>
    <div class="bottom-nav">
        <button class="nav-item" data-view="dashboard"><i class="fas fa-chart-pie"></i><span>Dashboard</span></button>
        <button class="nav-item" data-view="clientes"><i class="fas fa-users"></i><span>Clientes</span></button>
        <button class="nav-item" data-view="planos"><i class="fas fa-tags"></i><span>Planos</span></button>
        <button class="nav-item" data-view="alertas"><i class="fas fa-bell"></i><span>Alertas</span></button>
    </div>
</div>

<script>
    // ======================== DADOS E LÓGICA CENTRAL (INALTERADA) ========================
    let plans = [
        { id: "p1", name: "Básico Mensal", price: 29.90 },
        { id: "p2", name: "Padrão Mensal", price: 49.90 },
        { id: "p3", name: "Premium Mensal", price: 79.90 }
    ];
    let clients = [];

    function getToday() { let d = new Date(); d.setHours(0,0,0,0); return d; }
    function daysDiff(dateStr) {
        let due = new Date(dateStr); due.setHours(0,0,0,0);
        return Math.ceil((due - getToday()) / (1000*60*60*24));
    }
    function saveData() {
        localStorage.setItem("iptv_plans_app", JSON.stringify(plans));
        localStorage.setItem("iptv_clients_app", JSON.stringify(clients));
    }
    function loadData() {
        let savedPlans = localStorage.getItem("iptv_plans_app");
        let savedClients = localStorage.getItem("iptv_clients_app");
        if(savedPlans) plans = JSON.parse(savedPlans);
        if(savedClients) clients = JSON.parse(savedClients);
        if(plans.length===0) plans = [{ id: "p1", name: "Básico Mensal", price: 29.90 },{ id: "p2", name: "Padrão Mensal", price: 49.90 },{ id: "p3", name: "Premium Mensal", price: 79.90 }];
        if(clients.length===0) {
            let today = new Date();
            let in5 = new Date(); in5.setDate(today.getDate()+5);
            let over = new Date(); over.setDate(today.getDate()-2);
            let fut = new Date(); fut.setDate(today.getDate()+30);
            clients = [
                { id: "c1", name: "Carlos Andrade", phone: "5511988881111", planId: "p2", dueDate: in5.toISOString().split('T')[0] },
                { id: "c2", name: "Mariana Souza", phone: "5511999992222", planId: "p3", dueDate: over.toISOString().split('T')[0] },
                { id: "c3", name: "Fernando Rocha", phone: "5511977773333", planId: "p1", dueDate: fut.toISOString().split('T')[0] },
                { id: "c4", name: "Juliana Lima", phone: "5511966664444", planId: "p2", dueDate: fut.toISOString().split('T')[0] }
            ];
        }
    }
    function getPlanById(id) { return plans.find(p => p.id === id); }

    let currentView = "dashboard";
    let revenueChart = null;
    function refreshCurrentView() { renderView(currentView); }

    function renderDashboard() {
        let total = clients.length;
        let active = clients.filter(c => daysDiff(c.dueDate) >= 0).length;
        let monthly = clients.reduce((acc, c) => { let p = getPlanById(c.planId); if(p && daysDiff(c.dueDate)>=0) return acc + p.price; return acc; }, 0);
        
        let planStats = new Map();
        plans.forEach(p => planStats.set(p.id, { plan:p, revenue:0 }));
        clients.forEach(c => { let p = getPlanById(c.planId); if(p && daysDiff(c.dueDate)>=0) { let stat = planStats.get(p.id); if(stat) stat.revenue += p.price; } });
        let labels = [], data = [];
        for(let stat of planStats.values()) { labels.push(stat.plan.name); data.push(stat.revenue); }
        
        let html = `
            <div class="metrics-grid">
                <div class="metric-card" style="border-left-color:#3b82f6">
                    <div><div class="metric-title"><i class="fas fa-users"></i> Total Clientes</div><div class="metric-value">${total}</div></div>
                    <i class="fas fa-user-friends metric-icon"></i>
                </div>
                <div class="metric-card" style="border-left-color:#10b981">
                    <div><div class="metric-title"><i class="fas fa-check-circle"></i> Ativos</div><div class="metric-value">${active}</div></div>
                    <i class="fas fa-calendar-check metric-icon"></i>
                </div>
                <div class="metric-card" style="border-left-color:#f59e0b">
                    <div><div class="metric-title"><i class="fas fa-chart-line"></i> Faturamento Mensal</div><div class="metric-value">R$ ${monthly.toFixed(2)}</div></div>
                    <i class="fas fa-dollar-sign metric-icon"></i>
                </div>
                <div class="metric-card" style="border-left-color:#8b5cf6">
                    <div><div class="metric-title"><i class="fas fa-calendar-week"></i> Anual (proj)</div><div class="metric-value">R$ ${(monthly*12).toFixed(2)}</div></div>
                    <i class="fas fa-chart-simple metric-icon"></i>
                </div>
            </div>
            <div class="section-card">
                <div class="section-title"><i class="fas fa-chart-bar"></i> Receita por Plano</div>
                <div class="chart-wrapper"><canvas id="dashboardChart"></canvas></div>
                <div class="actions-grid" style="margin-top:12px"><button class="action-card-btn btn-primary-card" id="refreshDashboardBtn"><i class="fas fa-sync-alt"></i> Atualizar</button></div>
            </div>
            <div class="section-card">
                <div class="section-title"><i class="fas fa-clock"></i> Últimos clientes</div>
                <div id="lastClientsList" style="display:flex; flex-direction:column; gap:10px;"></div>
            </div>
        `;
        document.getElementById("viewContainer").innerHTML = html;
        const ctx = document.getElementById('dashboardChart')?.getContext('2d');
        if(ctx) {
            if(revenueChart) revenueChart.destroy();
            revenueChart = new Chart(ctx, { type: 'bar', data: { labels, datasets: [{ label: 'Receita (R$)', data, backgroundColor: '#8b5cf6', borderRadius: 10 }] }, options: { responsive: true, maintainAspectRatio: true } });
        }
        let lastClientsDiv = document.getElementById("lastClientsList");
        if(lastClientsDiv) {
            let recentes = [...clients].slice(-3).reverse();
            if(recentes.length===0) lastClientsDiv.innerHTML = "<div style='padding:12px;text-align:center'>Nenhum cliente</div>";
            else lastClientsDiv.innerHTML = recentes.map(c => `<div style="background:#f1f5f9; border-radius:24px; padding:10px; display:flex; justify-content:space-between"><span><i class="fas fa-user"></i> ${escapeHtml(c.name)}</span><span>${c.dueDate}</span></div>`).join('');
        }
        document.getElementById("refreshDashboardBtn")?.addEventListener("click", () => refreshCurrentView());
    }

    function renderClientes() {
        let html = `
            <div class="actions-grid" style="margin-bottom:12px">
                <button class="action-card-btn btn-primary-card" id="newClientBtnApp"><i class="fas fa-user-plus"></i> Novo Cliente</button>
                <button class="action-card-btn btn-whatsapp-card" id="globalWppBtn"><i class="fab fa-whatsapp"></i> Alertar Vencidos</button>
            </div>
            <div id="clientFormPanel" class="hidden" style="background:rgba(255,255,255,0.95); border-radius:28px; padding:16px; margin-bottom:16px;">
                <h3 id="formTitleApp">Adicionar Cliente</h3>
                <input type="text" id="clientName" placeholder="Nome completo">
                <input type="text" id="clientPhone" placeholder="WhatsApp (5511999999999)">
                <select id="clientPlanIdSelect"></select>
                <input type="date" id="clientDueDateInput">
                <div class="double-btns"><button class="btn-primary-card" id="saveClientAppBtn">Salvar</button><button class="btn-danger-card" id="cancelClientFormBtn">Cancelar</button></div>
            </div>
            <div id="clientsListApp" class="clients-list"></div>
        `;
        document.getElementById("viewContainer").innerHTML = html;
        populatePlanSelectApp();
        renderClientsListOnly();
        document.getElementById("newClientBtnApp")?.addEventListener("click", () => {
            let panel = document.getElementById("clientFormPanel");
            panel.classList.toggle("hidden");
            document.getElementById("formTitleApp").innerText = "➕ Adicionar Cliente";
            document.getElementById("saveClientAppBtn").removeAttribute("data-edit-id");
            document.getElementById("clientName").value = "";
            document.getElementById("clientPhone").value = "";
            document.getElementById("clientDueDateInput").value = "";
        });
        document.getElementById("cancelClientFormBtn")?.addEventListener("click", () => document.getElementById("clientFormPanel").classList.add("hidden"));
        document.getElementById("saveClientAppBtn")?.addEventListener("click", saveClientFromApp);
        document.getElementById("globalWppBtn")?.addEventListener("click", () => {
            let vencidos = clients.filter(c => daysDiff(c.dueDate) <= 2);
            if(vencidos.length===0) alert("Nenhum cliente com vencimento próximo.");
            else vencidos.forEach(c => sendWhatsApp(c));
        });
    }

    function populatePlanSelectApp() {
        let sel = document.getElementById("clientPlanIdSelect");
        if(sel) sel.innerHTML = plans.map(p => `<option value="${p.id}">${p.name} - R$ ${p.price.toFixed(2)}</option>`).join('');
    }

    function renderClientsListOnly() {
        let container = document.getElementById("clientsListApp");
        if(!container) return;
        if(clients.length===0) { container.innerHTML = "<div style='padding:20px;text-align:center'>Nenhum cliente</div>"; return; }
        container.innerHTML = clients.map(client => {
            let plan = getPlanById(client.planId);
            let days = daysDiff(client.dueDate);
            let statusClass = days >= 0 ? (days <= 5 ? "status-warning" : "status-active") : "status-expired";
            let statusText = days >= 0 ? (days <=5 ? "Próx venc" : "Ativo") : "Vencido";
            return `
                <div class="client-card">
                    <div class="client-header">
                        <div class="client-name"><i class="fas fa-user-circle"></i> ${escapeHtml(client.name)}</div>
                        <span class="status-badge ${statusClass}">${statusText}</span>
                    </div>
                    <div class="client-details">
                        <span><i class="fab fa-whatsapp"></i> ${escapeHtml(client.phone)}</span>
                        <span><i class="fas fa-tag"></i> ${plan?.name} R$ ${plan?.price.toFixed(2)}</span>
                        <span><i class="far fa-calendar"></i> ${client.dueDate} (${days} dias)</span>
                    </div>
                    <div class="client-actions">
                        <button class="client-action-icon" data-action="whatsapp" data-id="${client.id}"><i class="fab fa-whatsapp"></i> WhatsApp</button>
                        <button class="client-action-icon" data-action="renew" data-id="${client.id}"><i class="fas fa-calendar-plus"></i> Renovar</button>
                        <button class="client-action-icon" data-action="edit" data-id="${client.id}"><i class="fas fa-edit"></i> Editar</button>
                        <button class="client-action-icon" data-action="delete" data-id="${client.id}"><i class="fas fa-trash-alt"></i> Excluir</button>
                    </div>
                </div>
            `;
        }).join('');
        document.querySelectorAll("#clientsListApp .client-action-icon").forEach(btn => {
            btn.addEventListener("click", (e) => {
                let action = btn.getAttribute("data-action");
                let id = btn.getAttribute("data-id");
                let client = clients.find(c=>c.id===id);
                if(!client) return;
                if(action === "whatsapp") sendWhatsApp(client);
                else if(action === "renew") { let dias = prompt("Dias a adicionar:", "30"); if(dias && !isNaN(parseInt(dias))){ let nd = new Date(client.dueDate); nd.setDate(nd.getDate()+parseInt(dias)); client.dueDate = nd.toISOString().split('T')[0]; saveData(); refreshCurrentView(); alert("Renovado!");} }
                else if(action === "edit") openEditClientForm(client);
                else if(action === "delete") { if(confirm("Remover cliente?")){ clients = clients.filter(c=>c.id!==id); saveData(); refreshCurrentView(); } }
            });
        });
    }

    function openEditClientForm(client) {
        let panel = document.getElementById("clientFormPanel");
        panel.classList.remove("hidden");
        document.getElementById("formTitleApp").innerHTML = "✏️ Editar Cliente";
        document.getElementById("clientName").value = client.name;
        document.getElementById("clientPhone").value = client.phone;
        document.getElementById("clientPlanIdSelect").value = client.planId;
        document.getElementById("clientDueDateInput").value = client.dueDate;
        document.getElementById("saveClientAppBtn").setAttribute("data-edit-id", client.id);
    }

    function saveClientFromApp() {
        let name = document.getElementById("clientName").value.trim();
        let phone = document.getElementById("clientPhone").value.trim();
        let planId = document.getElementById("clientPlanIdSelect").value;
        let dueDate = document.getElementById("clientDueDateInput").value;
        if(!name || !dueDate) { alert("Nome e data obrigatórios"); return; }
        let editId = document.getElementById("saveClientAppBtn").getAttribute("data-edit-id");
        if(editId) {
            let cl = clients.find(c=>c.id===editId);
            if(cl) { cl.name=name; cl.phone=phone; cl.planId=planId; cl.dueDate=dueDate; }
        } else {
            let newId = "c"+Date.now()+Math.random().toString(36);
            clients.push({ id: newId, name, phone, planId, dueDate });
        }
        saveData();
        document.getElementById("clientFormPanel").classList.add("hidden");
        refreshCurrentView();
        alert("Cliente salvo com sucesso!");
    }

    function renderPlanos() {
        let html = `
            <div class="section-card">
                <div class="section-title"><i class="fas fa-tags"></i> Planos de Assinatura</div>
                <div id="plansListApp" class="plans-grid"></div>
                <div class="actions-grid"><button class="action-card-btn" id="showAddPlanAppBtn"><i class="fas fa-plus"></i> Novo Plano</button></div>
                <div id="addPlanPanel" class="hidden" style="margin-top:12px;"><input type="text" id="newPlanNameApp" placeholder="Nome do plano"><input type="number" id="newPlanPriceApp" step="0.01" placeholder="Preço R$"><div class="double-btns"><button class="btn-primary-card" id="confirmAddPlanApp">Salvar</button><button class="btn-danger-card" id="cancelAddPlanApp">Cancelar</button></div></div>
            </div>
            <div class="section-card">
                <div class="section-title"><i class="fas fa-chart-line"></i> Resumo Financeiro</div>
                <div id="financeSummaryApp" style="background:#eef2ff; border-radius:24px; padding:12px; text-align:center;">Receita Mensal Ativa: R$ 0,00</div>
            </div>
        `;
        document.getElementById("viewContainer").innerHTML = html;
        renderPlansListApp();
        document.getElementById("showAddPlanAppBtn")?.addEventListener("click", () => document.getElementById("addPlanPanel").classList.toggle("hidden"));
        document.getElementById("cancelAddPlanApp")?.addEventListener("click", () => document.getElementById("addPlanPanel").classList.add("hidden"));
        document.getElementById("confirmAddPlanApp")?.addEventListener("click", () => {
            let name = document.getElementById("newPlanNameApp").value.trim();
            let price = parseFloat(document.getElementById("newPlanPriceApp").value);
            if(!name || isNaN(price)) { alert("Nome e preço válidos"); return; }
            plans.push({ id: "plan_"+Date.now(), name, price });
            saveData();
            refreshCurrentView();
            alert("Plano adicionado");
        });
        let monthlyActive = clients.reduce((acc,c) => { let p = getPlanById(c.planId); if(p && daysDiff(c.dueDate)>=0) return acc + p.price; return acc; },0);
        document.getElementById("financeSummaryApp").innerHTML = `Receita Mensal Ativa: R$ ${monthlyActive.toFixed(2)}`;
    }

    function renderPlansListApp() {
        let container = document.getElementById("plansListApp");
        if(!container) return;
        container.innerHTML = plans.map(plan => {
            let count = clients.filter(c=>c.planId===plan.id).length;
            return `<div class="plan-card" style="flex:1; min-width:140px;"><strong>${escapeHtml(plan.name)}</strong><br>R$ ${plan.price.toFixed(2)}<br><small>${count} assinantes</small><div style="margin-top:8px; display:flex; gap:6px;"><button class="editPlanBtnApp" data-id="${plan.id}" style="background:white; border:none; border-radius:20px; padding:4px 12px;">Editar</button><button class="delPlanBtnApp" data-id="${plan.id}" style="background:#ffdddd; border:none; border-radius:20px; padding:4px 12px;">Excluir</button></div></div>`;
        }).join('');
        document.querySelectorAll(".editPlanBtnApp").forEach(btn => {
            btn.addEventListener("click", () => { let id = btn.getAttribute("data-id"); let p = plans.find(pl=>pl.id===id); let newName = prompt("Novo nome", p.name); let newPrice = parseFloat(prompt("Novo preço", p.price)); if(newName && !isNaN(newPrice)) { p.name=newName; p.price=newPrice; saveData(); refreshCurrentView(); } });
        });
        document.querySelectorAll(".delPlanBtnApp").forEach(btn => {
            btn.addEventListener("click", () => { let id = btn.getAttribute("data-id"); let used = clients.some(c=>c.planId===id); if(used) { alert("Existem clientes usando este plano. Remova ou troque o plano deles primeiro."); return; } plans = plans.filter(p=>p.id!==id); saveData(); refreshCurrentView(); });
        });
    }

    function renderAlertas() {
        let near = clients.filter(c => { let d = daysDiff(c.dueDate); return d <= 5 && d >= -3; });
        let html = `<div class="section-card"><div class="section-title"><i class="fas fa-bell"></i> Alertas de Vencimento</div><div id="alertsListApp"></div></div>`;
        document.getElementById("viewContainer").innerHTML = html;
        let container = document.getElementById("alertsListApp");
        if(near.length===0) container.innerHTML = "<div style='padding:20px;text-align:center'>✅ Sem alertas ativos</div>";
        else {
            container.innerHTML = near.map(c => {
                let days = daysDiff(c.dueDate);
                let msg = days<0 ? `Vencido há ${Math.abs(days)} dias` : `Vence em ${days} dias`;
                return `<div class="alert-card-mobile ${days<0 ? 'alert-expired':''}"><div><strong>${escapeHtml(c.name)}</strong><br>${msg}<br><small>${escapeHtml(c.phone)}</small></div><button class="tiny-btn" style="background:#25D366; border:none; padding:8px 16px; border-radius:40px; color:white;" data-waid="${c.id}"><i class="fab fa-whatsapp"></i> Notificar</button></div>`;
            }).join('');
            document.querySelectorAll("[data-waid]").forEach(btn => {
                btn.addEventListener("click", (e) => { let id = btn.getAttribute("data-waid"); let cli = clients.find(c=>c.id===id); if(cli) sendWhatsApp(cli); });
            });
        }
    }

    function sendWhatsApp(client) {
        let plan = getPlanById(client.planId);
        let days = daysDiff(client.dueDate);
        
        let statusMsg;
        if (days <= 0) {
            statusMsg = "⚠️ *ATENÇÃO:* Sua assinatura está *VENCIDA*! ⚠️\nPara não perder o acesso, realize a renovação o quanto antes.";
        } else if (days <= 5) {
            statusMsg = `📅 *Seu plano vence em ${days} dia${days !== 1 ? 's' : ''}.*\nAproveite e garanta a continuidade do serviço.`;
        } else {
            statusMsg = `📅 *Sua assinatura está ativa* e vencerá em ${days} dias.\nFique atento à data de renovação.`;
        }
        
        let message = `*Olá ${client.name}!* 👋\n\n` +
                      `Seu plano *${plan?.name}* - R$ ${plan?.price.toFixed(2)}.\n\n` +
                      `${statusMsg}\n\n` +
                      `📞 *Entre em contato conosco* para renovar ou tirar dúvidas.\n\n` +
                      `✨ *Equipe de Suporte* ✨`;
        
        let encoded = encodeURIComponent(message);
        let phone = client.phone.replace(/\D/g, '');
        if (phone) {
            window.open(`https://wa.me/${phone}?text=${encoded}`, '_blank');
        } else {
            alert("Número de WhatsApp inválido");
        }
    }

    function escapeHtml(str) { if(!str) return ''; return str.replace(/[&<>]/g, function(m){ if(m==='&') return '&amp;'; if(m==='<') return '&lt;'; if(m==='>') return '&gt;'; return m;}); }

    function renderView(view) {
        currentView = view;
        if(view === 'dashboard') renderDashboard();
        else if(view === 'clientes') renderClientes();
        else if(view === 'planos') renderPlanos();
        else if(view === 'alertas') renderAlertas();
        document.querySelectorAll('.nav-item').forEach(btn => {
            if(btn.getAttribute('data-view') === view) btn.classList.add('active');
            else btn.classList.remove('active');
        });
    }

    // PWA sem banner
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
    });

    if ('serviceWorker' in navigator) {
        const swCode = `self.addEventListener('install', event => { self.skipWaiting(); }); self.addEventListener('fetch', event => { event.respondWith(fetch(event.request).catch(() => caches.match(event.request))); });`;
        const blob = new Blob([swCode], {type: 'application/javascript'});
        const swUrl = URL.createObjectURL(blob);
        navigator.serviceWorker.register(swUrl).then(reg => console.log('SW registrado')).catch(err => console.log('SW falhou', err));
    }

    loadData();
    document.querySelectorAll('.nav-item').forEach(btn => {
        btn.addEventListener('click', (e) => { renderView(btn.getAttribute('data-view')); });
    });
    renderView('dashboard');
</script>
</body>
</html>
