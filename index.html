<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0a0a0a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Gestão">
    <title>Gestão | Dashboard Profissional</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif;
            background: radial-gradient(circle at 10% 20%, #0f0f0f, #050505);
            color: #eef2ff;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* Cabeçalho premium */
        .app-header {
            background: rgba(10, 10, 10, 0.75);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(249, 115, 22, 0.2);
            padding: 14px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 10;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .logo-image {
            width: 38px;
            height: 38px;
            object-fit: contain;
            border-radius: 12px;
            background: rgba(249,115,22,0.15);
            padding: 4px;
            box-shadow: 0 0 8px rgba(249,115,22,0.3);
        }
        .logo-text {
            font-weight: 700;
            font-size: 1.5rem;
            background: linear-gradient(135deg, #ffffff, #f97316);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.5px;
        }
        .icon-btn {
            background: rgba(30,30,30,0.9);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 60px;
            padding: 8px 20px;
            color: #fef3c7;
            font-weight: 500;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            backdrop-filter: blur(4px);
        }
        .icon-btn:active {
            transform: scale(0.96);
            background: #2a2a2a;
        }

        /* Conteúdo rolável */
        .pages-container {
            flex: 1;
            overflow-y: auto;
            padding: 28px 24px 90px 24px;
            scroll-behavior: smooth;
        }
        .page {
            display: none;
            animation: fadeSlide 0.3s ease-out;
        }
        .page.active {
            display: block;
        }
        @keyframes fadeSlide {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Bottom Bar refinada */
        .bottom-tab-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(10, 10, 10, 0.85);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(249,115,22,0.25);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 8px 16px 14px;
            z-index: 20;
            box-shadow: 0 -6px 20px rgba(0,0,0,0.4);
        }
        .tab-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            background: none;
            border: none;
            color: #9ca3af;
            font-size: 0.7rem;
            font-weight: 500;
            padding: 8px 0;
            border-radius: 40px;
            transition: all 0.2s;
            cursor: pointer;
        }
        .tab-item .tab-icon {
            font-size: 1.6rem;
            transition: transform 0.1s;
        }
        .tab-item.active {
            color: #f97316;
            background: rgba(249,115,22,0.12);
        }
        .tab-item:active .tab-icon {
            transform: scale(0.94);
        }

        /* Cards premium */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 24px;
            margin-bottom: 32px;
        }
        .card, .client-card, .plano-card, .produto-card, .aviso-card, .relatorio-card {
            background: rgba(18, 18, 18, 0.85);
            backdrop-filter: blur(4px);
            border-radius: 32px;
            padding: 22px;
            box-shadow: 0 12px 28px rgba(0,0,0,0.5), 0 0 0 1px rgba(249,115,22,0.08);
            transition: all 0.25s ease;
            border: none;
        }
        .card:hover, .client-card:hover, .plano-card:hover, .produto-card:hover, .aviso-card:hover, .relatorio-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 32px rgba(0,0,0,0.6), 0 0 0 1px rgba(249,115,22,0.25);
        }

        .card-icon {
            font-size: 2.4rem;
            margin-bottom: 14px;
            display: inline-block;
            filter: drop-shadow(0 2px 6px rgba(249,115,22,0.4));
        }
        .card-value {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #fff, #fcd34d);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.02em;
        }
        .card-label {
            font-size: 0.8rem;
            color: #cbd5e1;
            font-weight: 500;
            margin-top: 6px;
            letter-spacing: 0.2px;
        }

        /* Cliente card */
        .client-card .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }
        .client-name {
            font-weight: 700;
            font-size: 1.1rem;
            background: linear-gradient(135deg, #fff, #fcd34d);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .client-status {
            font-size: 0.7rem;
            padding: 4px 12px;
            border-radius: 60px;
            font-weight: 600;
            backdrop-filter: blur(2px);
        }
        .status-ativo { background: rgba(34,197,94,0.2); color: #86efac; border: 1px solid #4ade80; }
        .status-vencido { background: rgba(239,68,68,0.2); color: #fca5a5; border: 1px solid #ef4444; }
        .client-info {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }
        .info-row {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.85rem;
            color: #cbd5e1;
        }
        .info-row strong {
            color: white;
            min-width: 60px;
            font-weight: 600;
        }
        .card-actions {
            display: flex;
            justify-content: flex-end;
            gap: 14px;
            border-top: 1px solid rgba(255,255,255,0.08);
            padding-top: 16px;
        }

        /* Planos card */
        .plano-card .plano-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            padding-bottom: 12px;
        }
        .plano-nome {
            font-size: 1.3rem;
            font-weight: 800;
            background: linear-gradient(135deg, #fff, #f97316);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .plano-duracao {
            background: rgba(255,255,255,0.05);
            color: #fcd34d;
            border-radius: 50px;
            padding: 4px 12px;
            font-size: 0.75rem;
            font-weight: 500;
            border: 1px solid rgba(253,186,116,0.3);
        }
        .plano-detalhes {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }
        .detalhe-linha {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
        }
        .detalhe-label {
            color: #94a3b8;
        }
        .detalhe-valor {
            font-weight: 700;
            color: #ffffff;
        }
        .lucro-destaque {
            color: #86efac;
        }

        /* Produto card */
        .produto-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            padding-bottom: 10px;
        }
        .produto-nome {
            font-size: 1.2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #fff, #fcd34d);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .produto-qtd {
            background: linear-gradient(135deg, #f97316, #ea580c);
            color: white;
            border-radius: 40px;
            padding: 5px 14px;
            font-size: 0.8rem;
            font-weight: 700;
            box-shadow: 0 2px 8px rgba(249,115,22,0.4);
        }
        .produto-info {
            margin-bottom: 22px;
            background: rgba(0,0,0,0.3);
            border-radius: 24px;
            padding: 12px;
            text-align: center;
        }
        .produto-actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
        }

        /* Avisos card */
        .aviso-card {
            border-left: 4px solid #f97316;
        }
        .aviso-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            padding-bottom: 8px;
        }
        .aviso-nome {
            font-size: 1.1rem;
            font-weight: 800;
            background: linear-gradient(135deg, #fff, #fcd34d);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .aviso-urgente { background: rgba(239,68,68,0.2); color: #fca5a5; }
        .aviso-alerta { background: rgba(245,158,11,0.2); color: #fde047; }
        .aviso-info {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 18px;
        }
        .aviso-linha {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
        }

        /* Relatório card */
        .relatorio-card {
            border-left: 3px solid #f97316;
        }
        .relatorio-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            padding-bottom: 8px;
        }
        .relatorio-nome {
            font-size: 1rem;
            font-weight: 800;
            background: linear-gradient(135deg, #fff, #fcd34d);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        /* Botões e ações */
        .btn-icon {
            background: rgba(30,30,30,0.9);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 40px;
            padding: 6px 16px;
            font-size: 0.75rem;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
            color: #e2e8f0;
        }
        .btn-edit:hover, .btn-delete:hover { background: rgba(255,255,255,0.08); }
        .btn-whatsapp-card {
            background: linear-gradient(135deg, #25D366, #128C7E);
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 60px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.8rem;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn-whatsapp-card:active { transform: scale(0.96); }
        .btn-produto {
            background: rgba(30,30,30,0.8);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 40px;
            padding: 8px 18px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            color: #e2e8f0;
        }
        .btn-entrada { background: rgba(34,197,94,0.2); color: #86efac; }
        .btn-saida { background: rgba(239,68,68,0.2); color: #fca5a5; }

        /* Filtros e inputs */
        .table-header {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            margin-bottom: 24px;
            align-items: center;
        }
        .table-header input, .table-header select {
            background: #1a1a1a;
            border: 1px solid #333;
            color: #e2e8f0;
            padding: 12px 18px;
            border-radius: 60px;
            font-size: 0.85rem;
            flex: 1;
            outline: none;
            transition: 0.2s;
        }
        .table-header input:focus, .table-header select:focus {
            border-color: #f97316;
            box-shadow: 0 0 0 2px rgba(249,115,22,0.3);
        }
        .btn {
            padding: 8px 24px;
            border-radius: 60px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: 0.2s;
            font-size: 0.85rem;
        }
        .btn-primary {
            background: linear-gradient(135deg, #f97316, #ea580c);
            color: white;
            box-shadow: 0 4px 12px rgba(249,115,22,0.3);
        }
        .btn-primary:active { transform: scale(0.96); }
        .btn-whatsapp {
            background: linear-gradient(135deg, #25D366, #128C7E);
            color: white;
        }
        .glass-panel {
            background: rgba(18,18,18,0.85);
            backdrop-filter: blur(8px);
            border-radius: 32px;
            padding: 24px;
            border: 1px solid rgba(249,115,22,0.2);
        }
        .chart-container {
            display: flex;
            align-items: flex-end;
            gap: 16px;
            overflow-x: auto;
            padding: 16px 0;
        }
        .chart-bar-wrap {
            min-width: 70px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        .chart-bar {
            width: 45px;
            background: linear-gradient(135deg, #f97316, #fdba74);
            border-radius: 16px 16px 0 0;
            transition: height 0.3s;
        }

        /* Modal refinado */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            z-index: 200;
            display: flex;
            align-items: flex-end;
            justify-content: center;
        }
        .modal {
            background: #141414;
            border-radius: 36px 36px 0 0;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
            padding: 28px 24px;
            border-top: 3px solid #f97316;
        }
        .modal h3 {
            margin-bottom: 20px;
            font-weight: 700;
            font-size: 1.4rem;
            background: linear-gradient(135deg, #fff, #fcd34d);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .modal input, .modal select {
            width: 100%;
            padding: 14px 18px;
            margin-bottom: 18px;
            background: #1f1f1f;
            border: 1px solid #333;
            border-radius: 32px;
            font-size: 0.9rem;
            color: #e2e8f0;
        }
        .toast {
            position: fixed;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #1e293b, #0f172a);
            color: white;
            padding: 10px 24px;
            border-radius: 60px;
            font-weight: 500;
            z-index: 300;
            animation: fadeUp 0.3s ease;
            white-space: nowrap;
            font-size: 0.85rem;
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateX(-50%) translateY(20px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        h2, .page h2 {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, #ffffff, #fcd34d);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 6px;
        }
        @media (max-width: 640px) {
            .pages-container { padding: 20px 16px 85px; }
            .cards-grid { gap: 16px; }
            .card, .client-card, .plano-card, .produto-card, .aviso-card { padding: 16px; }
            .logo-image { width: 32px; height: 32px; }
            .logo-text { font-size: 1.2rem; }
        }
    </style>
</head>
<body>

<div class="app-header">
    <div class="logo-area">
        <img src="https://i.im.ge/QMqruep/ChatGPT_Image_12_05_2026_00_07_55.png" alt="Logo Gestão" class="logo-image" onerror="this.onerror=null; this.src='data:image/svg+xml,%3Csvg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 100 100\'%3E%3Crect width=\'100\' height=\'100\' fill=\'%23f97316\'/%3E%3Ctext x=\'50\' y=\'68\' font-size=\'50\' text-anchor=\'middle\' fill=\'white\'%3E📺%3C/text%3E%3C/svg%3E';">
        <span class="logo-text">Gestão</span>
    </div>
    <div class="header-actions">
        <button class="icon-btn" onclick="abrirMenuMais()">⚙️ Mais</button>
    </div>
</div>

<div class="pages-container" id="pages-container">
    <!-- Dashboard -->
    <div class="page active" id="page-dashboard">
        <h2>Dashboard</h2>
        <p style="color:#94a3b8; margin-bottom:28px;">Visão executiva e métricas do negócio</p>
        <div class="cards-grid" id="dashboard-cards"></div>
        <div class="glass-panel">
            <h4 style="color:#fcd34d; margin-bottom:20px; font-weight:600;">📈 Receita mensal (R$)</h4>
            <div class="chart-container" id="chart-receita"></div>
        </div>
    </div>

    <!-- Clientes -->
    <div class="page" id="page-clientes">
        <h2>Clientes</h2>
        <div class="table-header">
            <input type="text" id="search-clientes" placeholder="🔍 Nome ou telefone..." oninput="renderClientesCards()">
            <select id="filtro-status-clientes" onchange="renderClientesCards()">
                <option value="todos">Todos</option>
                <option value="ativo">Ativos</option>
                <option value="vencido">Vencidos</option>
            </select>
            <button class="btn btn-primary" onclick="abrirModalCliente()">+ Novo Cliente</button>
        </div>
        <div id="clientes-cards-container" class="cards-grid"></div>
    </div>

    <!-- Financeiro -->
    <div class="page" id="page-financeiro">
        <h2>Financeiro</h2>
        <div class="cards-grid" id="financeiro-cards"></div>
        <div class="glass-panel">
            <h4 style="color:#fcd34d; margin-bottom:18px;">Resumo por plano</h4>
            <div id="resumo-planos-cards" class="cards-grid" style="grid-template-columns: repeat(auto-fill, minmax(260px,1fr));"></div>
        </div>
    </div>

    <!-- Estoque -->
    <div class="page" id="page-estoque">
        <h2>Estoque</h2>
        <div style="display: flex; justify-content: flex-end; margin-bottom: 24px;">
            <button class="btn btn-primary" onclick="abrirModalProduto()">+ Novo Produto</button>
        </div>
        <div id="estoque-cards-container" class="cards-grid"></div>
    </div>

    <!-- Avisos -->
    <div class="page" id="page-avisos">
        <h2>Avisos</h2>
        <div style="background:rgba(245,158,11,0.15); padding:8px 18px; border-radius:60px; margin-bottom:20px; display:inline-block; color:#fde047;">
            ⚠️ Clientes com vencimento próximo ou atrasado
        </div>
        <div style="display: flex; justify-content: flex-end; margin-bottom: 20px;">
            <button class="btn btn-whatsapp" onclick="enviarAvisosWeb()">📱 Enviar avisos em massa</button>
        </div>
        <div id="avisos-cards-container" class="cards-grid"></div>
    </div>
</div>

<!-- Bottom Tab Bar -->
<div class="bottom-tab-bar">
    <button class="tab-item" data-page="dashboard"><span class="tab-icon">📊</span><span>Início</span></button>
    <button class="tab-item" data-page="clientes"><span class="tab-icon">👥</span><span>Clientes</span></button>
    <button class="tab-item" data-page="financeiro"><span class="tab-icon">💰</span><span>Financeiro</span></button>
    <button class="tab-item" data-page="estoque"><span class="tab-icon">📦</span><span>Estoque</span></button>
    <button class="tab-item" data-page="avisos"><span class="tab-icon">💬</span><span>Avisos</span></button>
</div>

<!-- Modais (mesma estrutura) -->
<div class="modal-overlay" id="modal-cliente-overlay" style="display:none;" onclick="fecharModal(event,'modal-cliente-overlay')"><div class="modal" onclick="event.stopPropagation()"><h3>Dados do Cliente</h3><form id="form-cliente" onsubmit="salvarCliente(event)"><input type="hidden" id="cliente-id"><label>Nome completo</label><input type="text" id="cliente-nome" required><label>Telefone (com DDD)</label><input type="text" id="cliente-telefone" required><label>Plano</label><select id="cliente-plano" required onchange="atualizarValoresPlano()"></select><div style="display:flex;gap:10px;"><div style="flex:1"><label>Valor R$</label><input type="number" id="cliente-valor" step="0.01"></div><div style="flex:1"><label>Custo R$</label><input type="number" id="cliente-custo" step="0.01"></div></div><label>Data de vencimento</label><input type="date" id="cliente-vencimento" required><label>Status</label><select id="cliente-status"><option value="ativo">Ativo</option><option value="vencido">Vencido</option></select><div style="display:flex;gap:10px;margin-top:20px;"><button type="button" class="btn" onclick="fecharModal(null,'modal-cliente-overlay')">Cancelar</button><button type="submit" class="btn btn-primary">Salvar</button></div></form></div></div>

<div class="modal-overlay" id="modal-plano-overlay" style="display:none;" onclick="fecharModal(event,'modal-plano-overlay')"><div class="modal" onclick="event.stopPropagation()"><h3>Plano</h3><form id="form-plano" onsubmit="salvarPlano(event)"><input type="hidden" id="plano-id"><label>Nome do plano</label><input type="text" id="plano-nome" required><label>Duração (dias)</label><input type="number" id="plano-duracao" required><label>Valor R$</label><input type="number" id="plano-valor" step="0.01"><label>Custo R$</label><input type="number" id="plano-custo" step="0.01"><div style="display:flex;gap:10px;"><button type="button" class="btn" onclick="fecharModal(null,'modal-plano-overlay')">Cancelar</button><button type="submit" class="btn btn-primary">Salvar</button></div></form></div></div>

<div class="modal-overlay" id="modal-produto-overlay" style="display:none;" onclick="fecharModal(event,'modal-produto-overlay')"><div class="modal" onclick="event.stopPropagation()"><h3>Produto</h3><form id="form-produto" onsubmit="salvarProduto(event)"><input type="hidden" id="produto-id"><label>Nome do produto</label><input type="text" id="produto-nome" required><div id="campo-qtd-inicial"><label>Quantidade inicial</label><input type="number" id="produto-qtd-inicial" value="0"></div><div id="aviso-edicao-produto" style="background:#1a1a1a; padding:8px; border-radius:20px; margin:8px 0; display:none;">Edição: use movimentações para alterar estoque</div><div style="display:flex;gap:10px;"><button type="button" class="btn" onclick="fecharModal(null,'modal-produto-overlay')">Cancelar</button><button type="submit" class="btn btn-primary">Salvar</button></div></form></div></div>

<div class="modal-overlay" id="modal-movimentacao-overlay" style="display:none;" onclick="fecharModal(event,'modal-movimentacao-overlay')"><div class="modal"><h3>Movimentação</h3><form id="form-movimentacao" onsubmit="salvarMovimentacao(event)"><input type="hidden" id="mov-produto-id"><input type="hidden" id="mov-tipo"><p>Produto: <strong id="mov-produto-nome"></strong></p><label>Quantidade</label><input type="number" id="mov-quantidade" required><label>Data</label><input type="date" id="mov-data"><div style="display:flex;gap:10px;"><button type="button" class="btn" onclick="fecharModal(null,'modal-movimentacao-overlay')">Cancelar</button><button type="submit" class="btn btn-primary">Registrar</button></div></form></div></div>

<div id="toast" style="display:none;"></div>

<script>
    // ========== SISTEMA COMPLETO (TODAS AS FUNÇÕES ORIGINAIS) ==========
    const STORAGE_KEYS = { clientes: 'iptv_prof', planos: 'iptv_planos_prof', produtos: 'iptv_produtos_prof' };
    let clientes = [], planos = [], produtos = [];
    let ultimosClientesFiltrados = [];
    const DIAS_AVISO_PREVIO = 3;

    const gerarId = () => 'id_' + Date.now() + '_' + Math.random().toString(36).substr(2,6);
    const addDias = (data, dias) => { let d = new Date(data); d.setDate(d.getDate() + dias); return d.toISOString().split('T')[0]; };
    const formatarData = s => s ? s.split('-').reverse().join('/') : '-';
    const formatarMoeda = v => Number(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2});
    const calcularLucro = (v,c) => (Number(v)||0)-(Number(c)||0);
    const hojeStr = () => new Date().toISOString().split('T')[0];
    const salvar = tipo => localStorage.setItem(STORAGE_KEYS[tipo], JSON.stringify(eval(tipo)));
    function escapeHTML(str){ if(!str) return ''; return str.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])); }

    function carregarDados() {
        clientes = JSON.parse(localStorage.getItem(STORAGE_KEYS.clientes)||'[]');
        planos = JSON.parse(localStorage.getItem(STORAGE_KEYS.planos)||'[]');
        produtos = JSON.parse(localStorage.getItem(STORAGE_KEYS.produtos)||'[]');
        if(!planos.length) planos = [{id:'p1',nome:'Mensal',duracao:30,valor:35,custo:15},{id:'p2',nome:'Trimestral',duracao:90,valor:90,custo:35},{id:'p3',nome:'Anual',duracao:365,valor:300,custo:100}];
        if(!produtos.length) produtos = [{id:'pr1',nome:'Crédito IPTV',quantidade:20,movimentacoes:[{tipo:'entrada',quantidade:20,data:hojeStr(),obs:'Inicial'}]},{id:'pr2',nome:'TV Box',quantidade:10,movimentacoes:[{tipo:'entrada',quantidade:10,data:hojeStr(),obs:'Inicial'}]}];
        if(!clientes.length){ 
            let h=new Date(); 
            clientes=[
                {id:'c1',nome:'João Silva',telefone:'11999991111',plano:'Mensal',valor:35,custo:15,inicio:addDias(h,-20),vencimento:addDias(h,10),status:'ativo'},
                {id:'c2',nome:'Maria Oliveira',telefone:'11988882222',plano:'Trimestral',valor:90,custo:35,inicio:addDias(h,-60),vencimento:addDias(h,30),status:'ativo'},
                {id:'c3',nome:'Carlos Mendes',telefone:'11977773333',plano:'Mensal',valor:35,custo:15,inicio:addDias(h,-25),vencimento:addDias(h,2),status:'ativo'},
                {id:'c4',nome:'Ana Souza',telefone:'11966664444',plano:'Anual',valor:300,custo:100,inicio:addDias(h,-200),vencimento:addDias(h,-5),status:'vencido'}
            ]; 
        }
        salvar('clientes'); salvar('planos'); salvar('produtos');
    }

    function verificarVencimentos(){ let hoje=new Date(); hoje.setHours(0,0,0,0); let alt=false; clientes.forEach(c=>{ if(c.status==='ativo' && new Date(c.vencimento+'T00:00:00')<hoje){ c.status='vencido'; alt=true; } }); if(alt){ salvar('clientes'); atualizarTudo(); mostrarToast('Status atualizados'); } }

    function navigateTo(pageId){
        document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
        document.getElementById(`page-${pageId}`).classList.add('active');
        document.querySelectorAll('.tab-item').forEach(tab=>{
            if(tab.dataset.page === pageId) tab.classList.add('active');
            else tab.classList.remove('active');
        });
        atualizarTudo();
    }
    document.querySelectorAll('.tab-item').forEach(tab=>{
        tab.addEventListener('click',()=>navigateTo(tab.dataset.page));
    });

    function abrirMenuMais(){
        let op = prompt("Acessar:\n1 - Planos\n2 - Relatórios\nDigite o número:");
        if(op === '1') navigateTo('planos');
        else if(op === '2') navigateTo('relatorios');
        else if(op) mostrarToast('Opção inválida');
    }

    // Páginas extras (Planos e Relatórios)
    function adicionarPaginasExtras(){
        const container = document.getElementById('pages-container');
        if(!document.getElementById('page-planos')){
            const divPlanos = document.createElement('div');
            divPlanos.id = 'page-planos';
            divPlanos.className = 'page';
            divPlanos.innerHTML = `<h2>Planos</h2><div style="display: flex; justify-content: flex-end; margin-bottom:20px;"><button class="btn btn-primary" onclick="abrirModalPlano()">+ Novo Plano</button></div><div id="planos-cards-container" class="cards-grid"></div>`;
            container.appendChild(divPlanos);
        }
        if(!document.getElementById('page-relatorios')){
            const divRel = document.createElement('div');
            divRel.id = 'page-relatorios';
            divRel.className = 'page';
            divRel.innerHTML = `<h2>Relatórios</h2><div style="display:flex; gap:12px; margin-bottom:20px; flex-wrap:wrap;"><input type="date" id="rel-data-inicio" style="flex:1;"><input type="date" id="rel-data-fim" style="flex:1;"><button class="btn btn-primary" onclick="atualizarRelatorios()">Filtrar</button><button class="btn" onclick="exportarCSV()">📥 CSV</button></div><div class="cards-grid" id="relatorio-cards"></div><div id="relatorio-clientes-container" class="cards-grid"></div>`;
            container.appendChild(divRel);
        }
    }
    adicionarPaginasExtras();

    function atualizarTudo(){
        atualizarDashboard(); atualizarFinanceiro(); renderClientesCards(); renderPlanosCards(); renderEstoqueCards(); renderAvisosCards(); preencherSelectPlanos(); if(document.getElementById('page-relatorios').classList.contains('active')) atualizarRelatorios();
    }

    // ========== RELATÓRIOS ==========
    function atualizarRelatorios() {
        const ini = document.getElementById('rel-data-inicio').value || addDias(new Date(), -30);
        const fim = document.getElementById('rel-data-fim').value || hojeStr();
        const fl = clientes.filter(c => {
            const i = new Date(c.inicio + 'T00:00:00');
            const v = new Date(c.vencimento + 'T00:00:00');
            const fi = new Date(ini + 'T00:00:00');
            const ff = new Date(fim + 'T00:00:00');
            return i <= ff && v >= fi;
        });
        ultimosClientesFiltrados = fl;
        const receitaPeriodo = fl.reduce((s, c) => s + Number(c.valor || 0), 0);
        document.getElementById('relatorio-cards').innerHTML = `<div class="card"><div class="card-value">R$ ${formatarMoeda(receitaPeriodo)}</div><div class="card-label">Receita no período</div></div><div class="card"><div class="card-value">${fl.length}</div><div class="card-label">Clientes no período</div></div>`;
        const container = document.getElementById('relatorio-clientes-container');
        if (!container) return;
        if (fl.length === 0) { container.innerHTML = '<div style="text-align:center; padding:40px;">Nenhum cliente encontrado</div>'; return; }
        container.innerHTML = fl.map(c => `<div class="relatorio-card"><div class="relatorio-header"><span class="relatorio-nome">${escapeHTML(c.nome)}</span><span class="client-status ${c.status==='ativo'?'status-ativo':'status-vencido'}">${c.status==='ativo'?'Ativo':'Vencido'}</span></div><div class="relatorio-info"><div class="relatorio-linha"><span>📞 Telefone</span><span>${escapeHTML(c.telefone)}</span></div><div class="relatorio-linha"><span>📋 Plano</span><span>${escapeHTML(c.plano)}</span></div><div class="relatorio-linha"><span>💰 Valor</span><span>R$ ${formatarMoeda(c.valor)}</span></div><div class="relatorio-linha"><span>📅 Vencimento</span><span>${formatarData(c.vencimento)}</span></div></div></div>`).join('');
    }

    // ========== AVISOS ==========
    function getClientesAviso(){ let hoje=new Date(); hoje.setHours(0,0,0,0); return clientes.filter(c=>{ if(c.status==='cancelado')return false; if(c.status==='vencido')return true; if(c.status==='ativo'){ let venc=new Date(c.vencimento+'T00:00:00'); let dias=Math.ceil((venc-hoje)/86400000); return dias>=0 && dias<=DIAS_AVISO_PREVIO; } return false; }); }
    function getSituacaoAviso(c){ if(c.status==='vencido')return {texto:'Vencido',classe:'aviso-urgente'}; let hoje=new Date(); let dias=Math.ceil((new Date(c.vencimento+'T00:00:00')-hoje)/86400000); if(dias===0)return {texto:'Vence hoje',classe:'aviso-urgente'}; return {texto:`Vence em ${dias} dias`,classe:'aviso-alerta'}; }
    function getMensagemAviso(c){ let hoje=new Date(); let dias=Math.ceil((new Date(c.vencimento+'T00:00:00')-hoje)/86400000); if(c.status==='vencido'||dias<0) return `Olá ${c.nome}, seu plano *${c.plano}* está VENCIDO! Renove agora: R$ ${formatarMoeda(c.valor)}`; else if(dias===0) return `⚠️ ${c.nome}, seu plano vence HOJE! Renove: R$ ${formatarMoeda(c.valor)}`; else return `🔔 ${c.nome}, seu plano vence em ${dias} dias (${formatarData(c.vencimento)}). Renove: R$ ${formatarMoeda(c.valor)}`; }
    function renderAvisosCards(){ const cont=document.getElementById('avisos-cards-container'); if(!cont)return; let av=getClientesAviso(); if(av.length===0){ cont.innerHTML='<div style="text-align:center; padding:40px;">✨ Nenhum aviso pendente</div>'; return; } cont.innerHTML=av.map(c=>{const s=getSituacaoAviso(c); return `<div class="aviso-card"><div class="aviso-header"><span class="aviso-nome">${escapeHTML(c.nome)}</span><span class="aviso-status ${s.classe}">${s.texto}</span></div><div class="aviso-info"><div class="aviso-linha"><span>📞 Telefone</span><span>${escapeHTML(c.telefone)}</span></div><div class="aviso-linha"><span>📋 Plano</span><span>${escapeHTML(c.plano)}</span></div><div class="aviso-linha"><span>💰 Valor</span><span>R$ ${formatarMoeda(c.valor)}</span></div><div class="aviso-linha"><span>📅 Vencimento</span><span>${formatarData(c.vencimento)}</span></div></div><div class="aviso-acoes"><button class="btn-whatsapp-card" onclick="abrirWhatsApp('${c.telefone}','${getMensagemAviso(c).replace(/'/g,"\\'")}')">📱 Enviar mensagem</button></div></div>`;}).join(''); }
    function abrirWhatsApp(tel,msg){ window.open(`https://wa.me/${tel.replace(/\D/g,'')}?text=${encodeURIComponent(msg)}`,'_blank'); }
    function enviarAvisosWeb(){ let av=getClientesAviso(); if(!av.length){mostrarToast('Nenhum aviso');return;} av.forEach(c=>setTimeout(()=>abrirWhatsApp(c.telefone,getMensagemAviso(c)),500)); mostrarToast(`Enviando para ${av.length} cliente(s)`); }

    // ========== PLANOS ==========
    function renderPlanosCards(){ const cont=document.getElementById('planos-cards-container'); if(!cont)return; if(planos.length===0){ cont.innerHTML='<div style="text-align:center; padding:40px;">Nenhum plano</div>'; return; } cont.innerHTML=planos.map(p=>{ const lucro=p.valor-p.custo; return `<div class="plano-card"><div class="plano-header"><span class="plano-nome">${escapeHTML(p.nome)}</span><span class="plano-duracao">${p.duracao} dias</span></div><div class="plano-detalhes"><div class="detalhe-linha"><span>💰 Valor</span><span class="detalhe-valor">R$ ${formatarMoeda(p.valor)}</span></div><div class="detalhe-linha"><span>📉 Custo</span><span class="detalhe-valor">R$ ${formatarMoeda(p.custo)}</span></div><div class="detalhe-linha"><span>📈 Lucro/assinatura</span><span class="lucro-destaque">R$ ${formatarMoeda(lucro)}</span></div></div><div class="plano-actions"><button class="btn-icon btn-edit" onclick="editarPlano('${p.id}')">✏️ Editar</button><button class="btn-icon btn-delete" onclick="excluirPlano('${p.id}')">🗑️ Excluir</button></div></div>`; }).join(''); }
    function abrirModalPlano(){ document.getElementById('form-plano').reset(); document.getElementById('plano-id').value=''; document.getElementById('modal-plano-overlay').style.display='flex'; }
    function editarPlano(id){ let p=planos.find(x=>x.id===id); document.getElementById('plano-id').value=p.id; document.getElementById('plano-nome').value=p.nome; document.getElementById('plano-duracao').value=p.duracao; document.getElementById('plano-valor').value=p.valor; document.getElementById('plano-custo').value=p.custo; document.getElementById('modal-plano-overlay').style.display='flex'; }
    function salvarPlano(e){ e.preventDefault(); let id=document.getElementById('plano-id').value; let nome=document.getElementById('plano-nome').value.trim(); if(!nome)return; let plano={id:id||gerarId(), nome, duracao:parseInt(document.getElementById('plano-duracao').value), valor:parseFloat(document.getElementById('plano-valor').value), custo:parseFloat(document.getElementById('plano-custo').value)}; if(id) planos=planos.map(p=>p.id===id?plano:p); else planos.push(plano); salvar('planos'); fecharModal(null,'modal-plano-overlay'); atualizarTudo(); mostrarToast('Plano salvo');}
    function excluirPlano(id){ let plano=planos.find(p=>p.id===id); if(clientes.some(c=>c.plano===plano.nome)){mostrarToast('Plano em uso'); return;} planos=planos.filter(p=>p.id!==id); salvar('planos'); atualizarTudo();}

    // ========== ESTOQUE ==========
    function renderEstoqueCards(){ const cont=document.getElementById('estoque-cards-container'); if(!cont)return; if(produtos.length===0){ cont.innerHTML='<div style="text-align:center; padding:40px;">Nenhum produto</div>'; return; } cont.innerHTML=produtos.map(p=>{ const ult=p.movimentacoes?.length?formatarData(p.movimentacoes[p.movimentacoes.length-1].data):'-'; return `<div class="produto-card"><div class="produto-header"><span class="produto-nome">${escapeHTML(p.nome)}</span><span class="produto-qtd">${p.quantidade} un.</span></div><div class="produto-info">📅 Última mov: ${ult}</div><div class="produto-actions"><button class="btn-produto btn-entrada" onclick="abrirMovimentacao('${p.id}','entrada')">➕ Entrada</button><button class="btn-produto btn-saida" onclick="abrirMovimentacao('${p.id}','saida')">➖ Saída</button><button class="btn-produto" onclick="editarProduto('${p.id}')">✏️ Editar</button><button class="btn-produto" onclick="excluirProduto('${p.id}')">🗑️ Excluir</button></div></div>`; }).join(''); }
    function abrirModalProduto(){ document.getElementById('form-produto').reset(); document.getElementById('produto-id').value=''; document.getElementById('campo-qtd-inicial').style.display='block'; document.getElementById('aviso-edicao-produto').style.display='none'; document.getElementById('modal-produto-overlay').style.display='flex'; }
    function editarProduto(id){ let p=produtos.find(x=>x.id===id); document.getElementById('produto-id').value=p.id; document.getElementById('produto-nome').value=p.nome; document.getElementById('campo-qtd-inicial').style.display='none'; document.getElementById('aviso-edicao-produto').style.display='block'; document.getElementById('modal-produto-overlay').style.display='flex'; }
    function salvarProduto(e){ e.preventDefault(); let id=document.getElementById('produto-id').value; let nome=document.getElementById('produto-nome').value.trim(); if(!nome)return; if(id){ let p=produtos.find(x=>x.id===id); p.nome=nome; salvar('produtos'); mostrarToast('Atualizado'); } else { let qtd=parseInt(document.getElementById('produto-qtd-inicial').value)||0; produtos.push({id:gerarId(), nome, quantidade:qtd, movimentacoes:qtd?[{tipo:'entrada',quantidade:qtd,data:hojeStr(),obs:'Inicial'}]:[]}); salvar('produtos'); mostrarToast('Produto criado'); } fecharModal(null,'modal-produto-overlay'); atualizarTudo(); }
    function excluirProduto(id){ if(confirm('Excluir?')){ produtos=produtos.filter(p=>p.id!==id); salvar('produtos'); atualizarTudo(); mostrarToast('Excluído'); } }
    function abrirMovimentacao(pid,tipo){ let p=produtos.find(x=>x.id===pid); document.getElementById('mov-produto-id').value=pid; document.getElementById('mov-tipo').value=tipo; document.getElementById('mov-produto-nome').innerText=p.nome; document.getElementById('form-movimentacao').reset(); document.getElementById('mov-data').value=hojeStr(); document.getElementById('modal-movimentacao-overlay').style.display='flex'; }
    function salvarMovimentacao(e){ e.preventDefault(); let pid=document.getElementById('mov-produto-id').value; let tipo=document.getElementById('mov-tipo').value; let qtd=parseInt(document.getElementById('mov-quantidade').value); let p=produtos.find(x=>x.id===pid); if(tipo==='saida' && qtd>p.quantidade){mostrarToast('Estoque insuficiente'); return;} p.movimentacoes.push({tipo, quantidade:qtd, data:document.getElementById('mov-data').value, obs:''}); p.quantidade+=tipo==='entrada'?qtd:-qtd; salvar('produtos'); fecharModal(null,'modal-movimentacao-overlay'); atualizarTudo(); mostrarToast('Registrado'); }

    // ========== CLIENTES ==========
    function renderClientesCards(){ const cont=document.getElementById('clientes-cards-container'); if(!cont)return; const busca=document.getElementById('search-clientes')?.value.toLowerCase()||''; const filtro=document.getElementById('filtro-status-clientes')?.value||'todos'; let lista=clientes.filter(c=>(!busca||c.nome.toLowerCase().includes(busca)||c.telefone.includes(busca)) && (filtro==='todos'||c.status===filtro)); if(lista.length===0){ cont.innerHTML='<div style="text-align:center; padding:40px;">Nenhum cliente</div>'; return; } cont.innerHTML=lista.map(c=>`<div class="client-card"><div class="card-header"><span class="client-name">${escapeHTML(c.nome)}</span><span class="client-status ${c.status==='ativo'?'status-ativo':'status-vencido'}">${c.status==='ativo'?'Ativo':'Vencido'}</span></div><div class="client-info"><div class="info-row"><strong>📞 Tel:</strong> ${escapeHTML(c.telefone)}</div><div class="info-row"><strong>📋 Plano:</strong> ${escapeHTML(c.plano)}</div><div class="info-row"><strong>💰 Valor:</strong> R$ ${formatarMoeda(c.valor)}</div><div class="info-row"><strong>📅 Venc:</strong> ${formatarData(c.vencimento)}</div></div><div class="card-actions"><button class="btn-icon btn-edit" onclick="editarCliente('${c.id}')">✏️ Editar</button><button class="btn-icon btn-delete" onclick="excluirCliente('${c.id}')">🗑️ Excluir</button></div></div>`).join(''); }
    function editarCliente(id){ let c=clientes.find(x=>x.id===id); if(!c)return; document.getElementById('cliente-id').value=c.id; document.getElementById('cliente-nome').value=c.nome; document.getElementById('cliente-telefone').value=c.telefone; preencherSelectPlanos(); document.getElementById('cliente-plano').value=c.plano; document.getElementById('cliente-valor').value=c.valor; document.getElementById('cliente-custo').value=c.custo; document.getElementById('cliente-vencimento').value=c.vencimento; document.getElementById('cliente-status').value=c.status; document.getElementById('modal-cliente-overlay').style.display='flex'; }
    function excluirCliente(id){ if(confirm('Excluir cliente?')){ clientes=clientes.filter(c=>c.id!==id); salvar('clientes'); atualizarTudo(); mostrarToast('Cliente removido'); } }
    function salvarCliente(e){ e.preventDefault(); let id=document.getElementById('cliente-id').value; let status=document.getElementById('cliente-status').value; let venc=document.getElementById('cliente-vencimento').value; let hoje=hojeStr(); if(status==='ativo' && venc<hoje && !confirm('Vencido, salvar como vencido?')) return; let c={id:id||gerarId(), nome:document.getElementById('cliente-nome').value.trim(), telefone:document.getElementById('cliente-telefone').value.trim(), plano:document.getElementById('cliente-plano').value, valor:parseFloat(document.getElementById('cliente-valor').value)||0, custo:parseFloat(document.getElementById('cliente-custo').value)||0, inicio:hoje, vencimento:venc, status:status==='ativo'&&venc<hoje?'vencido':status}; if(!c.nome||!c.telefone||!c.plano) return mostrarToast('Preencha todos'); if(id) clientes=clientes.map(x=>x.id===id?c:x); else clientes.unshift(c); salvar('clientes'); fecharModal(null,'modal-cliente-overlay'); atualizarTudo(); mostrarToast('Salvo'); }
    function preencherSelectPlanos(){ let sel=document.getElementById('cliente-plano'); sel.innerHTML='<option value="">Selecione</option>'; planos.forEach(p=>sel.innerHTML+=`<option value="${p.nome}">${p.nome}</option>`); }
    function atualizarValoresPlano(){ let nome=document.getElementById('cliente-plano').value; let p=planos.find(x=>x.nome===nome); if(p && !document.getElementById('cliente-id').value){ document.getElementById('cliente-valor').value=p.valor; document.getElementById('cliente-custo').value=p.custo; } }
    function abrirModalCliente(){ document.getElementById('form-cliente').reset(); document.getElementById('cliente-id').value=''; document.getElementById('cliente-status').value='ativo'; document.getElementById('cliente-vencimento').value=addDias(new Date(),30); preencherSelectPlanos(); document.getElementById('modal-cliente-overlay').style.display='flex'; }

    // ========== FINANCEIRO E DASHBOARD ==========
    function renderResumoPlanosCards(){ const cont=document.getElementById('resumo-planos-cards'); if(!cont)return; const resumo=planos.map(plano=>{ const cp=clientes.filter(c=>c.plano===plano.nome && c.status!=='cancelado'); return {...plano, qtd:cp.length, receita:cp.reduce((s,c)=>s+Number(c.valor),0), custo:cp.reduce((s,c)=>s+Number(c.custo),0), lucro:cp.reduce((s,c)=>s+calcularLucro(c.valor,c.custo),0)}; }).filter(p=>p.qtd>0); if(resumo.length===0){ cont.innerHTML='<div style="text-align:center; padding:40px;">Nenhum cliente ativo</div>'; return; } cont.innerHTML=resumo.map(plano=>`<div class="plano-card"><div class="plano-header"><strong style="font-size:1rem;">${escapeHTML(plano.nome)}</strong><span style="background:linear-gradient(135deg,#f97316,#ea580c); color:white; border-radius:40px; padding:2px 12px;">${plano.qtd} cliente(s)</span></div><div class="plano-detalhes"><div class="detalhe-linha"><span>💰 Receita:</span><span>R$ ${formatarMoeda(plano.receita)}</span></div><div class="detalhe-linha"><span>📉 Custo:</span><span>R$ ${formatarMoeda(plano.custo)}</span></div><div class="detalhe-linha"><span>📈 Lucro:</span><span class="lucro-destaque">R$ ${formatarMoeda(plano.lucro)}</span></div></div></div>`).join(''); }
    function atualizarFinanceiro(){ let receita=clientes.reduce((s,c)=>s+Number(c.valor),0); let custo=clientes.reduce((s,c)=>s+Number(c.custo),0); document.getElementById('financeiro-cards').innerHTML=`<div class="card"><div class="card-icon">💵</div><div class="card-value">R$ ${formatarMoeda(receita)}</div><div class="card-label">Receita Total</div></div><div class="card"><div class="card-icon">📤</div><div class="card-value">R$ ${formatarMoeda(custo)}</div><div class="card-label">Custo Total</div></div><div class="card"><div class="card-icon">📈</div><div class="card-value">R$ ${formatarMoeda(receita-custo)}</div><div class="card-label">Lucro Total</div></div>`; renderResumoPlanosCards(); }
    function atualizarDashboard(){ let t=clientes.length, a=clientes.filter(c=>c.status==='ativo').length, v=clientes.filter(c=>c.status==='vencido').length, l=clientes.reduce((s,c)=>s+calcularLucro(c.valor,c.custo),0); document.getElementById('dashboard-cards').innerHTML=`<div class="card" onclick="navigateTo('clientes')"><div class="card-icon">👥</div><div class="card-value">${t}</div><div class="card-label">Clientes</div></div><div class="card" onclick="navigateTo('clientes')"><div class="card-icon">✅</div><div class="card-value">${a}</div><div class="card-label">Ativos</div></div><div class="card" onclick="navigateTo('avisos')"><div class="card-icon">⚠️</div><div class="card-value">${v}</div><div class="card-label">Vencidos</div></div><div class="card" onclick="navigateTo('financeiro')"><div class="card-icon">💰</div><div class="card-value">R$ ${formatarMoeda(l)}</div><div class="card-label">Lucro Total</div></div>`; let meses=[]; for(let i=5;i>=0;i--){let d=new Date(); d.setMonth(d.getMonth()-i); meses.push({label:d.toLocaleDateString('pt-BR',{month:'short'}),receita:0});} clientes.forEach(c=>{if(c.status!=='cancelado'){let p=planos.find(pl=>pl.nome===c.plano); if(p){let rateio=c.valor/(p.duracao/30); let inicio=new Date(c.inicio+'T00:00:00'), fim=new Date(c.vencimento+'T00:00:00'); meses.forEach((m,idx)=>{let mesAtual=new Date(2023,idx,1); if(inicio<=new Date(mesAtual.getFullYear(),mesAtual.getMonth()+1,0) && fim>=new Date(mesAtual.getFullYear(),mesAtual.getMonth(),1)) m.receita+=rateio;});}}}); let max=Math.max(...meses.map(m=>m.receita),1); document.getElementById('chart-receita').innerHTML=meses.map(m=>`<div class="chart-bar-wrap"><span style="font-size:0.75rem; font-weight:500;">${formatarMoeda(m.receita)}</span><div class="chart-bar" style="height:${Math.max(m.receita/max*50,6)}px"></div><span style="font-size:0.7rem;">${m.label}</span></div>`).join(''); }

    // ========== UTILITÁRIOS ==========
    function exportarCSV(){ if(!ultimosClientesFiltrados.length){mostrarToast('Sem dados');return;} let csv="Nome,Telefone,Plano,Valor,Vencimento,Status\n"; ultimosClientesFiltrados.forEach(c=>csv+=`"${c.nome}","${c.telefone}","${c.plano}",${c.valor},"${formatarData(c.vencimento)}","${c.status}"\n`); let blob=new Blob([csv],{type:'text/csv'}); let a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='relatorio_gestao.csv'; a.click(); mostrarToast('Exportado'); }
    function fecharModal(event, modalId){ if(event && event.target !== document.getElementById(modalId)) return; document.getElementById(modalId).style.display='none'; }
    function mostrarToast(msg){ let t=document.getElementById('toast'); t.textContent=msg; t.style.display='block'; setTimeout(()=>{t.style.display='none';},2000); }
    
    carregarDados(); verificarVencimentos(); atualizarTudo(); setInterval(verificarVencimentos,60000); window.addEventListener('focus',verificarVencimentos);
</script>
</body>
