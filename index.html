<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barbearia Old School - Sistema Completo</title>
    <style>
        :root {
            --bg-dark: #1a1a1a;
            --bg-card: #242424;
            --gold: #c8a45c;
            --gold-hover: #d4b06a;
            --text: #e0e0e0;
            --text-light: #b0b0b0;
            --border: #3a3a3a;
            --danger: #e74c3c;
            --success: #2ecc71;
            --white: #ffffff;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            --radius: 16px;
            --radius-sm: 10px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --admin-bg: #0d0d0d;
            --admin-card: #1e1e1e;
            --admin-accent: #e67e22;
            --admin-accent-hover: #f39c12;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #111;
            background-image: radial-gradient(ellipse at 50% 0%, #1f1f1f 0%, #111 70%);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            line-height: 1.5;
        }

        /* Container principal */
        .app-container {
            width: 100%;
            max-width: 1200px;
            background: var(--bg-dark);
            border-radius: 24px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow), 0 0 0 1px rgba(255, 255, 255, 0.03) inset;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            min-height: 90vh;
            position: relative;
        }

        /* ========== HEADER ========== */
        .header {
            background: linear-gradient(180deg, #1c1c1c 0%, #181818 100%);
            border-bottom: 1px solid var(--border);
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }
        .header-brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .header-logo {
            width: 44px;
            height: 44px;
            background: var(--gold);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: #1a1a1a;
            font-weight: 900;
        }
        .header-info h1 {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--white);
            letter-spacing: 1px;
            text-transform: uppercase;
            line-height: 1.1;
        }
        .header-info span {
            font-size: 0.7rem;
            color: var(--gold);
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .header-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .btn-admin-toggle {
            background: transparent;
            border: 2px solid var(--border);
            color: var(--text-light);
            padding: 8px 16px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.8rem;
            letter-spacing: 0.5px;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .btn-admin-toggle:hover {
            border-color: var(--admin-accent);
            color: var(--admin-accent);
        }
        .btn-admin-toggle.active {
            background: var(--admin-accent);
            border-color: var(--admin-accent);
            color: #000;
        }
        .header-badge {
            background: var(--gold);
            color: #1a1a1a;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.8rem;
            animation: pulse-badge 2s infinite;
        }
        @keyframes pulse-badge {
            0%,
            100% {
                box-shadow: 0 0 0 0 rgba(200, 164, 92, 0.4);
            }
            50% {
                box-shadow: 0 0 0 10px rgba(200, 164, 92, 0);
            }
        }

        /* ========== MAIN CONTENT ========== */
        .main-content {
            flex: 1;
            padding: 20px 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .view-public,
        .view-admin {
            display: none;
            flex-direction: column;
            gap: 20px;
            flex: 1;
        }
        .view-public.active,
        .view-admin.active {
            display: flex;
        }

        /* ========== STEPS NAV (público) ========== */
        .steps-nav {
            display: flex;
            justify-content: center;
            gap: 0;
            padding: 12px 16px;
            background: #181818;
            border-bottom: 1px solid var(--border);
            flex-wrap: wrap;
        }
        .step-dot {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            border-radius: 25px;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-light);
            cursor: pointer;
            transition: var(--transition);
            white-space: nowrap;
            background: transparent;
            border: none;
        }
        .step-dot .num {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: var(--bg-card);
            border: 2px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.8rem;
            transition: var(--transition);
        }
        .step-dot.active {
            color: var(--white);
        }
        .step-dot.active .num {
            background: var(--gold);
            border-color: var(--gold);
            color: #1a1a1a;
        }
        .step-dot.done {
            color: var(--gold);
        }
        .step-dot.done .num {
            background: var(--gold);
            border-color: var(--gold);
            color: #1a1a1a;
        }
        .step-connector {
            width: 30px;
            height: 2px;
            background: var(--border);
            align-self: center;
            border-radius: 1px;
            margin: 0 2px;
        }
        .step-connector.done {
            background: var(--gold);
        }

        /* ========== CARDS & GRID ========== */
        .section-title {
            font-size: 1rem;
            font-weight: 700;
            color: var(--white);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: 0.5px;
        }
        .section-title::before {
            content: '';
            width: 4px;
            height: 18px;
            background: var(--gold);
            border-radius: 2px;
        }
        .services-grid,
        .barbers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 10px;
        }
        .service-card,
        .barber-card {
            background: var(--bg-card);
            border: 2px solid transparent;
            border-radius: var(--radius-sm);
            padding: 16px;
            cursor: pointer;
            transition: var(--transition);
            text-align: center;
            position: relative;
            user-select: none;
        }
        .service-card:hover,
        .barber-card:hover {
            border-color: #4a4a4a;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }
        .service-card.selected,
        .barber-card.selected {
            border-color: var(--gold);
            background: #1f1c16;
            box-shadow: 0 0 0 4px rgba(200, 164, 92, 0.08);
        }
        .service-card .check-mark,
        .barber-card .check-mark {
            position: absolute;
            top: 8px;
            right: 10px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--gold);
            color: #1a1a1a;
            font-size: 0.65rem;
            display: none;
            align-items: center;
            justify-content: center;
            font-weight: 900;
        }
        .service-card.selected .check-mark,
        .barber-card.selected .check-mark {
            display: flex;
        }
        .service-card .icon,
        .barber-avatar {
            font-size: 1.8rem;
            margin-bottom: 6px;
        }
        .service-card .name,
        .barber-name {
            font-weight: 700;
            color: var(--white);
            font-size: 0.9rem;
        }
        .service-card .price {
            color: var(--gold);
            font-weight: 700;
            font-size: 1rem;
            margin-top: 4px;
        }
        .service-card .duration {
            font-size: 0.7rem;
            color: var(--text-light);
        }
        .barber-specialty {
            font-size: 0.7rem;
            color: var(--text-light);
        }

        .date-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
            gap: 6px;
        }
        .date-btn {
            background: var(--bg-card);
            border: 2px solid transparent;
            border-radius: var(--radius-sm);
            padding: 10px 6px;
            cursor: pointer;
            transition: var(--transition);
            text-align: center;
            color: var(--text);
            font-weight: 600;
            font-size: 0.8rem;
        }
        .date-btn:hover {
            border-color: #4a4a4a;
        }
        .date-btn.selected {
            border-color: var(--gold);
            background: #1f1c16;
            color: var(--white);
        }
        .date-btn .day-num {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--white);
        }
        .date-btn .day-name {
            font-size: 0.65rem;
            color: var(--text-light);
            text-transform: uppercase;
        }
        .date-btn:disabled {
            opacity: 0.3;
            pointer-events: none;
        }
        .time-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 6px;
        }
        .time-btn {
            background: var(--bg-card);
            border: 2px solid transparent;
            border-radius: 25px;
            padding: 8px 12px;
            cursor: pointer;
            transition: var(--transition);
            text-align: center;
            color: var(--text);
            font-weight: 600;
            font-size: 0.85rem;
        }
        .time-btn:hover {
            border-color: #4a4a4a;
        }
        .time-btn.selected {
            border-color: var(--gold);
            background: #1f1c16;
            color: var(--white);
        }
        .time-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            text-decoration: line-through;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .form-group label {
            font-weight: 600;
            font-size: 0.8rem;
            color: var(--text-light);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .form-group input,
        .form-group textarea {
            background: var(--bg-card);
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 10px 14px;
            color: var(--white);
            font-size: 0.9rem;
            font-family: inherit;
            transition: var(--transition);
            outline: none;
            resize: vertical;
        }
        .form-group input:focus,
        .form-group textarea:focus {
            border-color: var(--gold);
            box-shadow: 0 0 0 4px rgba(200, 164, 92, 0.06);
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .summary-box {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 20px;
            border: 1px solid var(--border);
        }
        .summary-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid var(--border);
            font-size: 0.9rem;
        }
        .summary-row:last-child {
            border-bottom: none;
            font-weight: 700;
            color: var(--gold);
        }
        .link-copy-box {
            display: flex;
            gap: 6px;
            background: #1a1a1a;
            border-radius: 30px;
            padding: 5px 5px 5px 16px;
            border: 2px solid var(--border);
            align-items: center;
        }
        .link-copy-box input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--gold);
            font-size: 0.8rem;
            outline: none;
            font-family: monospace;
            min-width: 0;
        }
        .confirmation-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 30px 24px;
            text-align: center;
            border: 2px solid var(--success);
            max-width: 500px;
            margin: 0 auto;
            width: 100%;
        }
        .confirmation-card .check-icon {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: var(--success);
            margin: 0 auto 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            color: #fff;
            animation: pop-in 0.5s ease;
        }
        @keyframes pop-in {
            0% {
                transform: scale(0);
                opacity: 0;
            }
            70% {
                transform: scale(1.15);
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 10px 22px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            transition: var(--transition);
            border: none;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            font-family: inherit;
        }
        .btn-primary {
            background: var(--gold);
            color: #1a1a1a;
            box-shadow: 0 4px 16px rgba(200, 164, 92, 0.25);
        }
        .btn-primary:hover {
            background: var(--gold-hover);
            transform: translateY(-2px);
        }
        .btn-outline {
            background: transparent;
            border: 2px solid var(--border);
            color: var(--text);
        }
        .btn-outline:hover {
            border-color: var(--gold);
            color: var(--white);
        }
        .btn-danger {
            background: var(--danger);
            color: #fff;
        }
        .btn-danger:hover {
            opacity: 0.85;
        }
        .btn-sm {
            padding: 6px 14px;
            font-size: 0.75rem;
        }
        .btn-full {
            width: 100%;
            justify-content: center;
        }
        .actions-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: flex-end;
            margin-top: 8px;
        }
        .panel {
            display: none;
        }
        .panel.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ========== ADMIN PANEL ========== */
        .admin-tabs {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            border-bottom: 2px solid var(--border);
            padding-bottom: 0;
        }
        .admin-tab {
            background: transparent;
            border: none;
            color: var(--text-light);
            padding: 10px 18px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            border-radius: 8px 8px 0 0;
            transition: var(--transition);
            letter-spacing: 0.5px;
        }
        .admin-tab:hover {
            color: var(--white);
            background: #222;
        }
        .admin-tab.active {
            color: var(--admin-accent);
            border-bottom: 3px solid var(--admin-accent);
            background: #1a1a1a;
        }
        .admin-panel-content {
            background: var(--admin-card);
            border-radius: var(--radius-sm);
            padding: 20px;
            min-height: 300px;
        }
        .admin-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
        }
        .admin-table th,
        .admin-table td {
            padding: 10px 12px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }
        .admin-table th {
            color: var(--admin-accent);
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.7rem;
            letter-spacing: 1px;
        }
        .admin-table tr:hover td {
            background: #1a1a1a;
        }
        .admin-form-row {
            display: flex;
            gap: 8px;
            align-items: flex-end;
            flex-wrap: wrap;
        }
        .admin-form-row input {
            background: #111;
            border: 2px solid var(--border);
            color: #fff;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-family: inherit;
            flex: 1;
            min-width: 120px;
            outline: none;
        }
        .admin-form-row input:focus {
            border-color: var(--admin-accent);
        }
        .badge-status {
            padding: 4px 10px;
            border-radius: 15px;
            font-weight: 600;
            font-size: 0.7rem;
            text-transform: uppercase;
        }
        .badge-confirmado {
            background: #1e3a2f;
            color: #2ecc71;
        }
        .badge-cancelado {
            background: #3a1e1e;
            color: #e74c3c;
        }
        .badge-pendente {
            background: #3a351e;
            color: #f39c12;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--success);
            color: #fff;
            padding: 12px 22px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 0.85rem;
            z-index: 1000;
            opacity: 0;
            transition: all 0.4s ease;
            pointer-events: none;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        @media (max-width: 768px) {
            .header {
                padding: 12px 16px;
                justify-content: center;
                text-align: center;
            }
            .services-grid,
            .barbers-grid {
                grid-template-columns: 1fr 1fr;
            }
            .date-grid {
                grid-template-columns: repeat(4, 1fr);
            }
            .time-grid {
                grid-template-columns: repeat(3, 1fr);
            }
            .form-row {
                grid-template-columns: 1fr;
            }
            .admin-form-row {
                flex-direction: column;
                align-items: stretch;
            }
        }
        @media (max-width: 400px) {
            .services-grid,
            .barbers-grid {
                grid-template-columns: 1fr;
            }
            .date-grid {
                grid-template-columns: repeat(3, 1fr);
            }
            .time-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- HEADER -->
        <header class="header">
            <div class="header-brand">
                <div class="header-logo">✂</div>
                <div class="header-info">
                    <h1>Old School</h1>
                    <span>Barbearia Premium</span>
                </div>
            </div>
            <div class="header-actions">
                <span class="header-badge" id="publicBadge">📅 Agende Online</span>
                <button class="btn-admin-toggle" id="btnAdminToggle" onclick="toggleAdminView()">
                    🔒 Administração
                </button>
            </div>
        </header>

        <!-- VIEW PÚBLICA -->
        <div class="view-public active" id="viewPublic">
            <nav class="steps-nav" id="stepsNav">
                <button class="step-dot active" data-step="1"><span class="num">1</span> Serviço</button>
                <span class="step-connector" id="conn1"></span>
                <button class="step-dot" data-step="2"><span class="num">2</span> Barbeiro</button>
                <span class="step-connector" id="conn2"></span>
                <button class="step-dot" data-step="3"><span class="num">3</span> Data/Hora</button>
                <span class="step-connector" id="conn3"></span>
                <button class="step-dot" data-step="4"><span class="num">4</span> Seus Dados</button>
                <span class="step-connector" id="conn4"></span>
                <button class="step-dot" data-step="5"><span class="num">5</span> Confirmar</button>
            </nav>
            <main class="main-content" id="mainContentPublic">
                <div class="panel active" id="panel-step1">
                    <div class="section-title">Escolha o serviço</div>
                    <div class="services-grid" id="servicesGrid"></div>
                    <div class="actions-row"><button class="btn btn-primary" onclick="goToStep(2)" id="btnStep1" disabled>Próximo →</button></div>
                </div>
                <div class="panel" id="panel-step2">
                    <div class="section-title">Escolha o barbeiro</div>
                    <div class="barbers-grid" id="barbersGrid"></div>
                    <div class="actions-row"><button class="btn btn-outline" onclick="goToStep(1)">← Voltar</button><button class="btn btn-primary" onclick="goToStep(3)" id="btnStep2" disabled>Próximo →</button></div>
                </div>
                <div class="panel" id="panel-step3">
                    <div class="section-title">Escolha a data</div>
                    <div class="date-grid" id="dateGrid"></div>
                    <div class="section-title" style="margin-top:16px;">Escolha o horário</div>
                    <div class="time-grid" id="timeGrid"><p style="color:var(--text-light);grid-column:1/-1;text-align:center;">Selecione uma data primeiro</p></div>
                    <div class="actions-row"><button class="btn btn-outline" onclick="goToStep(2)">← Voltar</button><button class="btn btn-primary" onclick="goToStep(4)" id="btnStep3" disabled>Próximo →</button></div>
                </div>
                <div class="panel" id="panel-step4">
                    <div class="section-title">Seus dados</div>
                    <div style="display:flex;flex-direction:column;gap:14px;max-width:550px;">
                        <div class="form-row">
                            <div class="form-group"><label>Nome completo</label><input type="text" id="inputNome" placeholder="Seu nome" autocomplete="name"></div>
                            <div class="form-group"><label>Telefone / WhatsApp</label><input type="tel" id="inputTelefone" placeholder="(11) 99999-9999" autocomplete="tel"></div>
                        </div>
                        <div class="form-group"><label>E-mail (opcional)</label><input type="email" id="inputEmail" placeholder="seu@email.com"></div>
                        <div class="form-group"><label>Observação (opcional)</label><textarea id="inputObs" rows="2" placeholder="Alguma preferência..."></textarea></div>
                    </div>
                    <div class="actions-row"><button class="btn btn-outline" onclick="goToStep(3)">← Voltar</button><button class="btn btn-primary" onclick="goToStep(5)" id="btnStep4">Próximo →</button></div>
                </div>
                <div class="panel" id="panel-step5">
                    <div class="section-title">Revise seu agendamento</div>
                    <div class="summary-box" id="summaryBox"></div>
                    <div style="display:flex;flex-direction:column;gap:6px;max-width:550px;margin-top:8px;">
                        <label style="font-weight:600;color:var(--text-light);font-size:0.8rem;text-transform:uppercase;">🔗 Link do agendamento</label>
                        <div class="link-copy-box"><input type="text" id="linkAgendamento" readonly><button class="btn btn-primary btn-sm" onclick="copiarLink()">📋 Copiar</button></div>
                    </div>
                    <div class="actions-row" style="margin-top:12px;"><button class="btn btn-outline" onclick="goToStep(4)">← Voltar</button><button class="btn btn-primary" onclick="confirmarAgendamento()">✅ Confirmar</button></div>
                </div>
                <div class="panel" id="panel-done">
                    <div class="confirmation-card">
                        <div class="check-icon">✓</div>
                        <h2>Agendamento Confirmado!</h2>
                        <p>Seu horário foi reservado com sucesso.</p>
                        <div class="confirmation-details" id="doneDetails" style="background:#1a1a1a;border-radius:10px;padding:14px;text-align:left;margin:16px 0;"></div>
                        <button class="btn btn-primary btn-full" onclick="novoAgendamento()">🗓️ Novo agendamento</button>
                    </div>
                </div>
            </main>
        </div>

        <!-- VIEW ADMIN -->
        <div class="view-admin" id="viewAdmin">
            <main class="main-content">
                <div class="admin-tabs">
                    <button class="admin-tab active" data-admin-tab="tab-servicos">💈 Serviços</button>
                    <button class="admin-tab" data-admin-tab="tab-barbeiros">👤 Barbeiros</button>
                    <button class="admin-tab" data-admin-tab="tab-agendamentos">📋 Agendamentos</button>
                    <button class="admin-tab" data-admin-tab="tab-config">⚙️ Configurações</button>
                </div>
                <div class="admin-panel-content" id="adminPanelContent">
                    <!-- Conteúdo dinâmico -->
                </div>
            </main>
        </div>
    </div>
    <div class="toast" id="toast">Mensagem</div>

    <script>
        (function() {
            // ============ STORAGE ============
            const STORAGE_KEY = 'barbearia_old_school_data';
            let db = {
                services: [
                    { id: 'corte', name: 'Corte Clássico', icon: '💈', price: 55, duration: 30 },
                    { id: 'degrade', name: 'Corte Degradê', icon: '🔥', price: 65, duration: 40 },
                    { id: 'barba', name: 'Barba', icon: '🧔', price: 40, duration: 25 },
                    { id: 'barba-nav', name: 'Barba + Navalha', icon: '🪒', price: 55, duration: 35 },
                    { id: 'combo', name: 'Combo Corte + Barba', icon: '⭐', price: 90, duration: 55 },
                    { id: 'hidratacao', name: 'Hidratação Capilar', icon: '💆', price: 70, duration: 30 },
                ],
                barbers: [
                    { id: 'marcos', name: 'Marcos', avatar: '🧔‍♂️', specialty: 'Cortes Clássicos' },
                    { id: 'lucas', name: 'Lucas', avatar: '💇‍♂️', specialty: 'Degradê & Moderno' },
                    { id: 'pedro', name: 'Pedro', avatar: '🪒', specialty: 'Barba & Navalha' },
                ],
                agendamentos: [],
                config: {
                    horaAbertura: 9,
                    horaFechamento: 19,
                    diasFolga: [0], // 0 = domingo
                    senhaAdmin: 'admin123',
                }
            };

            function loadDB() {
                try {
                    const saved = localStorage.getItem(STORAGE_KEY);
                    if (saved) {
                        const parsed = JSON.parse(saved);
                        db.services = parsed.services || db.services;
                        db.barbers = parsed.barbers || db.barbers;
                        db.agendamentos = parsed.agendamentos || [];
                        db.config = { ...db.config, ...(parsed.config || {}) };
                    }
                } catch (e) { /* usa default */ }
            }

            function saveDB() {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
            }
            loadDB();

            // ============ STATE ============
            let state = {
                step: 1,
                maxStepReached: 1,
                selectedService: null,
                selectedBarber: null,
                selectedDate: null,
                selectedTime: null,
                nome: '',
                telefone: '',
                email: '',
                obs: '',
                confirmed: false,
                isAdmin: false,
                adminTab: 'tab-servicos',
            };

            // ============ DOM REFS ============
            const $viewPublic = document.getElementById('viewPublic');
            const $viewAdmin = document.getElementById('viewAdmin');
            const $btnAdminToggle = document.getElementById('btnAdminToggle');
            const $publicBadge = document.getElementById('publicBadge');
            const $servicesGrid = document.getElementById('servicesGrid');
            const $barbersGrid = document.getElementById('barbersGrid');
            const $dateGrid = document.getElementById('dateGrid');
            const $timeGrid = document.getElementById('timeGrid');
            const $summaryBox = document.getElementById('summaryBox');
            const $linkAgendamento = document.getElementById('linkAgendamento');
            const $toast = document.getElementById('toast');
            const $adminPanelContent = document.getElementById('adminPanelContent');

            function showToast(msg, isError = false) {
                $toast.textContent = msg;
                $toast.style.background = isError ? 'var(--danger)' : 'var(--success)';
                $toast.classList.add('show');
                setTimeout(() => $toast.classList.remove('show'), 2200);
            }

            // ============ ADMIN TOGGLE ============
            window.toggleAdminView = function() {
                if (state.isAdmin) {
                    // Sair do admin
                    state.isAdmin = false;
                    updateViewVisibility();
                    $btnAdminToggle.classList.remove('active');
                    $btnAdminToggle.innerHTML = '🔒 Administração';
                } else {
                    // Login simples
                    const senha = prompt('Digite a senha de administrador:');
                    if (senha === db.config.senhaAdmin) {
                        state.isAdmin = true;
                        updateViewVisibility();
                        $btnAdminToggle.classList.add('active');
                        $btnAdminToggle.innerHTML = '🔓 Sair do Admin';
                        renderAdminPanel();
                        showToast('Acesso liberado! Bem-vindo, admin.');
                    } else if (senha !== null) {
                        alert('Senha incorreta!');
                    }
                }
            };

            function updateViewVisibility() {
                if (state.isAdmin) {
                    $viewPublic.classList.remove('active');
                    $viewAdmin.classList.add('active');
                    $publicBadge.style.display = 'none';
                } else {
                    $viewPublic.classList.add('active');
                    $viewAdmin.classList.remove('active');
                    $publicBadge.style.display = '';
                }
            }

            // ============ RENDER PÚBLICO ============
            function gerarDatas() {
                const datas = [];
                const hoje = new Date();
                for (let i = 1; i <= 14; i++) {
                    const d = new Date(hoje);
                    d.setDate(d.getDate() + i);
                    if (db.config.diasFolga.includes(d.getDay())) continue;
                    datas.push({
                        dateObj: new Date(d),
                        dayName: d.toLocaleDateString('pt-BR', { weekday: 'short' }).replace('.', ''),
                        dayNum: d.getDate(),
                        month: d.toLocaleDateString('pt-BR', { month: 'short' }).replace('.', ''),
                        iso: d.toISOString().split('T')[0],
                    });
                }
                return datas.slice(0, 12);
            }

            function gerarHorarios() {
                const horarios = [];
                for (let h = db.config.horaAbertura; h <= db.config.horaFechamento; h++) {
                    horarios.push(`${String(h).padStart(2,'0')}:00`);
                    if (h < db.config.horaFechamento) horarios.push(`${String(h).padStart(2,'0')}:30`);
                }
                return horarios;
            }

            function horariosIndisponiveis(dataIso) {
                const ocupados = db.agendamentos
                    .filter(a => a.data === dataIso && a.status === 'confirmado')
                    .map(a => a.hora);
                return new Set(ocupados);
            }

            function renderServices() {
                $servicesGrid.innerHTML = db.services.map(s => `
                <div class="service-card ${state.selectedService === s.id ? 'selected' : ''}" onclick="selectService('${s.id}')">
                  <span class="check-mark">✓</span>
                  <div class="icon">${s.icon}</div>
                  <div class="name">${s.name}</div>
                  <div class="price">R$ ${s.price.toFixed(2)}</div>
                  <div class="duration">⏱ ${s.duration} min</div>
                </div>`).join('');
            }

            function renderBarbers() {
                $barbersGrid.innerHTML = db.barbers.map(b => `
                <div class="barber-card ${state.selectedBarber === b.id ? 'selected' : ''}" onclick="selectBarber('${b.id}')">
                  <span class="check-mark">✓</span>
                  <div class="barber-avatar">${b.avatar}</div>
                  <div class="barber-name">${b.name}</div>
                  <div class="barber-specialty">${b.specialty}</div>
                </div>`).join('');
            }

            function renderDates() {
                const datas = gerarDatas();
                $dateGrid.innerHTML = datas.map(d => `
                <button class="date-btn ${state.selectedDate === d.iso ? 'selected' : ''}" onclick="selectDate('${d.iso}')">
                  <div class="day-name">${d.dayName}</div>
                  <div class="day-num">${d.dayNum}</div>
                  <div class="month">${d.month}</div>
                </button>`).join('');
            }

            function renderTimes() {
                if (!state.selectedDate) {
                    $timeGrid.innerHTML =
                        '<p style="color:var(--text-light);grid-column:1/-1;text-align:center;">Selecione uma data primeiro</p>';
                    return;
                }
                const indisponiveis = horariosIndisponiveis(state.selectedDate);
                const todos = gerarHorarios();
                $timeGrid.innerHTML = todos.map(t => {
                    const indisp = indisponiveis.has(t);
                    return `<button class="time-btn ${state.selectedTime===t?'selected':''}" ${indisp?'disabled':''} onclick="selectTime('${t}')">${t} ${indisp?'🔒':''}</button>`;
                }).join('');
            }

            function renderSummary() {
                const serv = db.services.find(s => s.id === state.selectedService);
                const barb = db.barbers.find(b => b.id === state.selectedBarber);
                const dataFmt = state.selectedDate ? new Date(state.selectedDate + 'T00:00:00')
                    .toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }) :
                    '—';
                $summaryBox.innerHTML = `
                <div class="summary-row"><span>Serviço</span><span>${serv?.icon||''} ${serv?.name||'—'}</span></div>
                <div class="summary-row"><span>Barbeiro</span><span>${barb?.avatar||''} ${barb?.name||'—'}</span></div>
                <div class="summary-row"><span>Data</span><span>📅 ${dataFmt}</span></div>
                <div class="summary-row"><span>Horário</span><span>🕐 ${state.selectedTime||'—'}</span></div>
                <div class="summary-row"><span>Duração</span><span>⏱ ${serv?.duration||'—'} min</span></div>
                <div class="summary-row"><span>Nome</span><span>${state.nome||'—'}</span></div>
                <div class="summary-row"><span>Telefone</span><span>${state.telefone||'—'}</span></div>
                <div class="summary-row" style="color:var(--gold);font-weight:700;"><span>💰 Total</span><span>R$ ${serv?.price?.toFixed(2)||'0.00'}</span></div>`;
                const base = window.location.origin + window.location.pathname;
                const link = base + '?ref=' + btoa(JSON.stringify({ s: state.selectedService, b: state
                    .selectedBarber, d: state.selectedDate, t: state.selectedTime }));
                $linkAgendamento.value = link;
            }

            function updateButtons() {
                document.getElementById('btnStep1').disabled = !state.selectedService;
                document.getElementById('btnStep2').disabled = !state.selectedBarber;
                document.getElementById('btnStep3').disabled = !(state.selectedDate && state.selectedTime);
            }

            window.selectService = function(id) {
                state.selectedService = id;
                state.maxStepReached = Math.max(state.maxStepReached, 1);
                renderServices();
                updateButtons();
            };
            window.selectBarber = function(id) {
                state.selectedBarber = id;
                state.maxStepReached = Math.max(state.maxStepReached, 2);
                renderBarbers();
                updateButtons();
            };
            window.selectDate = function(iso) {
                state.selectedDate = iso;
                state.selectedTime = null;
                state.maxStepReached = Math.max(state.maxStepReached, 3);
                renderDates();
                renderTimes();
                updateButtons();
            };
            window.selectTime = function(time) {
                state.selectedTime = time;
                state.maxStepReached = Math.max(state.maxStepReached, 3);
                renderTimes();
                updateButtons();
            };

            window.goToStep = function(step) {
                if (step > state.maxStepReached) {
                    if (step === 2 && !state.selectedService) return;
                    if (step === 3 && !state.selectedBarber) return;
                    if (step === 4 && !(state.selectedDate && state.selectedTime)) return;
                    if (step === 5) {
                        state.nome = document.getElementById('inputNome').value.trim();
                        state.telefone = document.getElementById('inputTelefone').value.trim();
                        state.email = document.getElementById('inputEmail').value.trim();
                        state.obs = document.getElementById('inputObs').value.trim();
                        if (!state.nome) { alert('Informe seu nome.'); return; }
                        if (!state.telefone) { alert('Informe seu telefone.'); return; }
                        renderSummary();
                    }
                    state.maxStepReached = Math.max(state.maxStepReached, step - 1);
                }
                state.step = step;
                if (step === 5) renderSummary();
                updateUIPublic();
            };

            window.confirmarAgendamento = function() {
                const serv = db.services.find(s => s.id === state.selectedService);
                const novo = {
                    id: 'ag_' + Date.now(),
                    servicoId: state.selectedService,
                    servicoNome: serv?.name || '',
                    servicoPreco: serv?.price || 0,
                    barbeiroId: state.selectedBarber,
                    barbeiroNome: db.barbers.find(b => b.id === state.selectedBarber)?.name || '',
                    data: state.selectedDate,
                    hora: state.selectedTime,
                    nome: state.nome,
                    telefone: state.telefone,
                    email: state.email,
                    obs: state.obs,
                    status: 'confirmado',
                    criadoEm: new Date().toISOString(),
                };
                db.agendamentos.push(novo);
                saveDB();
                state.confirmed = true;
                state.step = 6;
                const dataFmt = new Date(state.selectedDate + 'T00:00:00').toLocaleDateString('pt-BR', { weekday: 'long',
                    day: 'numeric', month: 'long' });
                document.getElementById('doneDetails').innerHTML = `
                <div style="display:flex;justify-content:space-between;padding:4px 0;"><span>Serviço:</span><strong>${serv?.name}</strong></div>
                <div style="display:flex;justify-content:space-between;padding:4px 0;"><span>Barbeiro:</span><strong>${novo.barbeiroNome}</strong></div>
                <div style="display:flex;justify-content:space-between;padding:4px 0;"><span>Data:</span><strong>${dataFmt}</strong></div>
                <div style="display:flex;justify-content:space-between;padding:4px 0;"><span>Horário:</span><strong>${state.selectedTime}</strong></div>
                <div style="display:flex;justify-content:space-between;padding:4px 0;color:var(--gold);"><span>Total:</span><strong>R$ ${serv?.price?.toFixed(2)}</strong></div>`;
                updateUIPublic();
                document.getElementById('mainContentPublic').scrollTop = 0;
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            window.novoAgendamento = function() {
                state = {
                    step: 1,
                    maxStepReached: 1,
                    selectedService: null,
                    selectedBarber: null,
                    selectedDate: null,
                    selectedTime: null,
                    nome: '',
                    telefone: '',
                    email: '',
                    obs: '',
                    confirmed: false,
                    isAdmin: state.isAdmin,
                    adminTab: state.adminTab,
                };
                ['inputNome', 'inputTelefone', 'inputEmail', 'inputObs'].forEach(id => document.getElementById(id)
                    .value = '');
                renderAllPublic();
                updateUIPublic();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            window.copiarLink = function() {
                const inp = document.getElementById('linkAgendamento');
                inp.select();
                inp.setSelectionRange(0, 99999);
                try { navigator.clipboard.writeText(inp.value); } catch (e) {}
                showToast('Link copiado! 📋');
            };

            function updateUIPublic() {
                const panels = ['panel-step1', 'panel-step2', 'panel-step3', 'panel-step4', 'panel-step5', 'panel-done'];
                panels.forEach((id, i) => {
                    document.getElementById(id).classList.toggle('active', (i + 1 === state.step) || (state.step ===
                        6 && id === 'panel-done'));
                });
                const dots = document.querySelectorAll('#stepsNav .step-dot');
                dots.forEach((dot, i) => {
                    const s = i + 1;
                    dot.classList.remove('active', 'done');
                    if (state.step === 6) { if (s <= 5) dot.classList.add('done'); } else if (s === state.step)
                        dot.classList.add('active');
                    else if (s < state.step) dot.classList.add('done');
                });
                for (let c = 1; c <= 4; c++) {
                    document.getElementById('conn' + c).classList.toggle('done', state.step > c || state.step === 6);
                }
                if (state.step >= 4) {
                    document.getElementById('inputNome').value = state.nome;
                    document.getElementById('inputTelefone').value = state.telefone;
                    document.getElementById('inputEmail').value = state.email;
                    document.getElementById('inputObs').value = state.obs;
                }
                updateButtons();
            }

            function renderAllPublic() {
                renderServices();
                renderBarbers();
                renderDates();
                renderTimes();
            }

            // ============ ADMIN PANEL ============
            function renderAdminPanel() {
                switch (state.adminTab) {
                    case 'tab-servicos':
                        renderAdminServicos();
                        break;
                    case 'tab-barbeiros':
                        renderAdminBarbeiros();
                        break;
                    case 'tab-agendamentos':
                        renderAdminAgendamentos();
                        break;
                    case 'tab-config':
                        renderAdminConfig();
                        break;
                }
            }

            function renderAdminServicos() {
                let html = `
                <h3 style="color:var(--white);margin-bottom:12px;">Gerenciar Serviços</h3>
                <div class="admin-form-row" style="margin-bottom:16px;">
                  <input type="text" id="newServNome" placeholder="Nome do serviço" style="flex:2;">
                  <input type="text" id="newServIcon" placeholder="Ícone (emoji)" style="flex:0.5;min-width:60px;" maxlength="2">
                  <input type="number" id="newServPreco" placeholder="Preço R$" step="0.01" style="flex:1;">
                  <input type="number" id="newServDur" placeholder="Duração (min)" style="flex:1;">
                  <button class="btn btn-primary btn-sm" onclick="adminAddServico()">➕ Adicionar</button>
                </div>
                <table class="admin-table">
                  <thead><tr><th>Ícone</th><th>Nome</th><th>Preço</th><th>Duração</th><th>Ações</th></tr></thead>
                  <tbody>`;
                db.services.forEach(s => {
                    html += `
                    <tr>
                      <td>${s.icon}</td>
                      <td>${s.name}</td>
                      <td>R$ ${s.price.toFixed(2)}</td>
                      <td>${s.duration} min</td>
                      <td>
                        <button class="btn btn-outline btn-sm" onclick="adminEditServico('${s.id}')">✏️</button>
                        <button class="btn btn-danger btn-sm" onclick="adminRemoveServico('${s.id}')">🗑️</button>
                      </td>
                    </tr>`;
                });
                html += '</tbody></table>';
                $adminPanelContent.innerHTML = html;
            }

            window.adminAddServico = function() {
                const nome = document.getElementById('newServNome').value.trim();
                const icon = document.getElementById('newServIcon').value.trim() || '✂️';
                const preco = parseFloat(document.getElementById('newServPreco').value);
                const dur = parseInt(document.getElementById('newServDur').value);
                if (!nome || isNaN(preco) || isNaN(dur)) { showToast('Preencha todos os campos!', true); return; }
                const id = 'serv_' + Date.now();
                db.services.push({ id, name: nome, icon, price: preco, duration: dur });
                saveDB();
                renderAdminServicos();
                renderAllPublic();
                showToast('Serviço adicionado!');
            };

            window.adminRemoveServico = function(id) {
                if (!confirm('Remover este serviço?')) return;
                db.services = db.services.filter(s => s.id !== id);
                saveDB();
                renderAdminServicos();
                renderAllPublic();
                showToast('Serviço removido.');
            };

            window.adminEditServico = function(id) {
                const s = db.services.find(s => s.id === id);
                if (!s) return;
                const nome = prompt('Nome:', s.name);
                if (nome === null) return;
                const icon = prompt('Ícone:', s.icon);
                if (icon === null) return;
                const preco = parseFloat(prompt('Preço:', s.price));
                if (isNaN(preco)) return;
                const dur = parseInt(prompt('Duração (min):', s.duration));
                if (isNaN(dur)) return;
                s.name = nome.trim();
                s.icon = icon.trim() || '✂️';
                s.price = preco;
                s.duration = dur;
                saveDB();
                renderAdminServicos();
                renderAllPublic();
                showToast('Serviço atualizado!');
            };

            function renderAdminBarbeiros() {
                let html = `
                <h3 style="color:var(--white);margin-bottom:12px;">Gerenciar Barbeiros</h3>
                <div class="admin-form-row" style="margin-bottom:16px;">
                  <input type="text" id="newBarbNome" placeholder="Nome" style="flex:2;">
                  <input type="text" id="newBarbAvatar" placeholder="Avatar (emoji)" style="flex:0.5;min-width:60px;" maxlength="2">
                  <input type="text" id="newBarbSpec" placeholder="Especialidade" style="flex:2;">
                  <button class="btn btn-primary btn-sm" onclick="adminAddBarbeiro()">➕ Adicionar</button>
                </div>
                <table class="admin-table">
                  <thead><tr><th>Avatar</th><th>Nome</th><th>Especialidade</th><th>Ações</th></tr></thead>
                  <tbody>`;
                db.barbers.forEach(b => {
                    html += `
                    <tr>
                      <td>${b.avatar}</td>
                      <td>${b.name}</td>
                      <td>${b.specialty}</td>
                      <td>
                        <button class="btn btn-outline btn-sm" onclick="adminEditBarbeiro('${b.id}')">✏️</button>
                        <button class="btn btn-danger btn-sm" onclick="adminRemoveBarbeiro('${b.id}')">🗑️</button>
                      </td>
                    </tr>`;
                });
                html += '</tbody></table>';
                $adminPanelContent.innerHTML = html;
            }

            window.adminAddBarbeiro = function() {
                const nome = document.getElementById('newBarbNome').value.trim();
                const avatar = document.getElementById('newBarbAvatar').value.trim() || '👤';
                const spec = document.getElementById('newBarbSpec').value.trim();
                if (!nome || !spec) { showToast('Preencha nome e especialidade!', true); return; }
                const id = 'barb_' + Date.now();
                db.barbers.push({ id, name: nome, avatar, specialty: spec });
                saveDB();
                renderAdminBarbeiros();
                renderAllPublic();
                showToast('Barbeiro adicionado!');
            };

            window.adminRemoveBarbeiro = function(id) {
                if (!confirm('Remover este barbeiro?')) return;
                db.barbers = db.barbers.filter(b => b.id !== id);
                saveDB();
                renderAdminBarbeiros();
                renderAllPublic();
                showToast('Barbeiro removido.');
            };

            window.adminEditBarbeiro = function(id) {
                const b = db.barbers.find(b => b.id === id);
                if (!b) return;
                const nome = prompt('Nome:', b.name);
                if (nome === null) return;
                const avatar = prompt('Avatar:', b.avatar);
                if (avatar === null) return;
                const spec = prompt('Especialidade:', b.specialty);
                if (spec === null) return;
                b.name = nome.trim();
                b.avatar = avatar.trim() || '👤';
                b.specialty = spec.trim();
                saveDB();
                renderAdminBarbeiros();
                renderAllPublic();
                showToast('Barbeiro atualizado!');
            };

            function renderAdminAgendamentos() {
                const ags = [...db.agendamentos].sort((a, b) => {
                    if (a.data !== b.data) return a.data.localeCompare(b.data);
                    return a.hora.localeCompare(b.hora);
                });
                let html = `<h3 style="color:var(--white);margin-bottom:12px;">Agendamentos (${ags.length})</h3>`;
                if (ags.length === 0) {
                    html += '<p style="color:var(--text-light);">Nenhum agendamento realizado ainda.</p>';
                } else {
                    html +=
                        `<table class="admin-table"><thead><tr><th>Data</th><th>Hora</th><th>Cliente</th><th>Serviço</th><th>Barbeiro</th><th>Status</th><th>Ações</th></tr></thead><tbody>`;
                    ags.forEach(a => {
                        const statusClass = a.status === 'confirmado' ? 'badge-confirmado' : a.status ===
                            'cancelado' ? 'badge-cancelado' : 'badge-pendente';
                        html += `
                        <tr>
                          <td>${new Date(a.data+'T00:00:00').toLocaleDateString('pt-BR')}</td>
                          <td>${a.hora}</td>
                          <td>${a.nome}<br><small>${a.telefone}</small></td>
                          <td>${a.servicoNome}</td>
                          <td>${a.barbeiroNome}</td>
                          <td><span class="badge-status ${statusClass}">${a.status}</span></td>
                          <td>
                            ${a.status==='confirmado' ? `<button class="btn btn-danger btn-sm" onclick="adminCancelarAgendamento('${a.id}')">❌ Cancelar</button>` : `<button class="btn btn-outline btn-sm" onclick="adminReativarAgendamento('${a.id}')">🔄 Reativar</button>`}
                          </td>
                        </tr>`;
                    });
                    html += '</tbody></table>';
                }
                $adminPanelContent.innerHTML = html;
            }

            window.adminCancelarAgendamento = function(id) {
                if (!confirm('Cancelar este agendamento?')) return;
                const ag = db.agendamentos.find(a => a.id === id);
                if (ag) ag.status = 'cancelado';
                saveDB();
                renderAdminAgendamentos();
                renderAllPublic();
                showToast('Agendamento cancelado.');
            };

            window.adminReativarAgendamento = function(id) {
                const ag = db.agendamentos.find(a => a.id === id);
                if (!ag) return;
                // Verificar conflito
                const conflito = db.agendamentos.some(a => a.id !== id && a.data === ag.data && a.hora === ag.hora && a
                    .status === 'confirmado');
                if (conflito) { showToast('Horário já ocupado!', true); return; }
                ag.status = 'confirmado';
                saveDB();
                renderAdminAgendamentos();
                renderAllPublic();
                showToast('Agendamento reativado.');
            };

            function renderAdminConfig() {
                const cfg = db.config;
                const diasSemana = ['Domingo', 'Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado'];
                let html = `
                <h3 style="color:var(--white);margin-bottom:12px;">⚙️ Configurações da Barbearia</h3>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;max-width:500px;">
                  <div class="form-group"><label>Horário de Abertura</label><input type="number" id="cfgAbertura" value="${cfg.horaAbertura}" min="0" max="23"></div>
                  <div class="form-group"><label>Horário de Fechamento</label><input type="number" id="cfgFechamento" value="${cfg.horaFechamento}" min="1" max="23"></div>
                </div>
                <div class="form-group" style="margin-top:12px;max-width:500px;">
                  <label>Dias de Folga (selecione os dias que a barbearia NÃO abre)</label>
                  <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:4px;">`;
                diasSemana.forEach((nome, idx) => {
                    const checked = cfg.diasFolga.includes(idx) ? 'checked' : '';
                    html +=
                        `<label style="display:flex;align-items:center;gap:4px;font-size:0.8rem;color:var(--text);"><input type="checkbox" value="${idx}" ${checked} class="cfg-dia-folga"> ${nome}</label>`;
                });
                html += `</div></div>
                <div class="form-group" style="margin-top:12px;max-width:500px;">
                  <label>Senha do Administrador</label>
                  <input type="text" id="cfgSenha" value="${cfg.senhaAdmin}">
                </div>
                <button class="btn btn-primary" style="margin-top:16px;" onclick="adminSalvarConfig()">💾 Salvar Configurações</button>`;
                $adminPanelContent.innerHTML = html;
            }

            window.adminSalvarConfig = function() {
                const abertura = parseInt(document.getElementById('cfgAbertura').value);
                const fechamento = parseInt(document.getElementById('cfgFechamento').value);
                const senha = document.getElementById('cfgSenha').value.trim();
                if (isNaN(abertura) || isNaN(fechamento) || abertura >= fechamento || !senha) {
                    showToast('Verifique os valores!', true);
                    return;
                }
                const diasFolga = [];
                document.querySelectorAll('.cfg-dia-folga:checked').forEach(cb => diasFolga.push(parseInt(cb.value)));
                db.config.horaAbertura = abertura;
                db.config.horaFechamento = fechamento;
                db.config.diasFolga = diasFolga;
                db.config.senhaAdmin = senha;
                saveDB();
                renderAllPublic();
                showToast('Configurações salvas!');
            };

            // Admin tabs click
            document.getElementById('adminPanelContent').addEventListener('click', function(e) {
                // delegado para tabs? tabs estão fora, então listener no container pai
            });
            document.querySelector('.admin-tabs').addEventListener('click', function(e) {
                const tab = e.target.closest('.admin-tab');
                if (!tab) return;
                const tabId = tab.dataset.adminTab;
                state.adminTab = tabId;
                document.querySelectorAll('.admin-tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                renderAdminPanel();
            });

            // Steps nav público
            document.getElementById('stepsNav').addEventListener('click', function(e) {
                const dot = e.target.closest('.step-dot');
                if (!dot) return;
                const step = parseInt(dot.dataset.step);
                if (step && step <= state.maxStepReached + 1) {
                    if (step === 5) {
                        state.nome = document.getElementById('inputNome').value.trim();
                        state.telefone = document.getElementById('inputTelefone').value.trim();
                        if (!state.nome || !state.telefone) { goToStep(4); return; }
                        renderSummary();
                    }
                    goToStep(step);
                }
            });

            // ============ INIT ============
            renderAllPublic();
            updateUIPublic();
            updateViewVisibility();

            // Expor funções globais adicionais
            window.adminAddServico = window.adminAddServico;
            window.adminRemoveServico = window.adminRemoveServico;
            window.adminEditServico = window.adminEditServico;
            window.adminAddBarbeiro = window.adminAddBarbeiro;
            window.adminRemoveBarbeiro = window.adminRemoveBarbeiro;
            window.adminEditBarbeiro = window.adminEditBarbeiro;
            window.adminCancelarAgendamento = window.adminCancelarAgendamento;
            window.adminReativarAgendamento = window.adminReativarAgendamento;
            window.adminSalvarConfig = window.adminSalvarConfig;
            window.goToStep = window.goToStep;
            window.selectService = window.selectService;
            window.selectBarber = window.selectBarber;
            window.selectDate = window.selectDate;
            window.selectTime = window.selectTime;
            window.confirmarAgendamento = window.confirmarAgendamento;
            window.novoAgendamento = window.novoAgendamento;
            window.copiarLink = window.copiarLink;
            window.toggleAdminView = window.toggleAdminView;
        })();
    </script>
</body>
</html>
