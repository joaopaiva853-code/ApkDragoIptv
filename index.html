<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#1a1a2e">
    <title>IPTV Manager</title>
    <style>
        :root {
            --bg-start: #1a1a2e;
            --bg-end: #16213e;
            --surface: #ffffff;
            --surface-transparent: rgba(255, 255, 255, 0.95);
            --text: #e0e0e0;
            --text-dark: #1a1a2e;
            --text-secondary: #a0a0b8;
            --primary: #7b5cff;
            --primary-light: #a78bfa;
            --primary-dark: #5b3ecc;
            --success: #00d68f;
            --warning: #ffaa00;
            --danger: #ff3d71;
            --info: #00b8d9;
            --radius: 18px;
            --radius-sm: 14px;
            --radius-xs: 10px;
            --shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
            --shadow-lg: 0 15px 35px rgba(0, 0, 0, 0.35);
            --bottom-nav-height: 64px;
            --header-height: 56px;
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --font: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            --gradient-primary: linear-gradient(135deg, #7b5cff, #a259ff);
            --gradient-success: linear-gradient(135deg, #00d68f, #2effb2);
            --gradient-warning: linear-gradient(135deg, #ffaa00, #ffcc00);
            --gradient-danger: linear-gradient(135deg, #ff3d71, #ff6b8a);
            --gradient-info: linear-gradient(135deg, #00b8d9, #33e0ff);
            --gradient-card-total: linear-gradient(135deg, #5e60ce, #7b5cff);
            --gradient-card-active: linear-gradient(135deg, #00b894, #00d68f);
            --gradient-card-expired: linear-gradient(135deg, #e17055, #ff3d71);
            --gradient-card-revenue: linear-gradient(135deg, #0984e3, #00b8d9);
            --glass-bg: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            user-select: none;
        }
        input,
        select,
        textarea,
        button {
            -webkit-user-select: auto;
            user-select: auto;
        }

        body {
            font-family: var(--font);
            background: linear-gradient(160deg, var(--bg-start) 0%, var(--bg-end) 100%);
            background-attachment: fixed;
            color: var(--text);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            overflow-x: hidden;
            padding-top: var(--header-height);
            padding-bottom: calc(var(--bottom-nav-height) + var(--safe-bottom) + 10px);
        }

        /* ===== HEADER ===== */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: var(--header-height);
            background: rgba(26, 26, 46, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            border-bottom: 1px solid var(--glass-border);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }
        .header .page-title {
            font-size: 1.2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #c7b9ff, #fff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.3px;
        }
        .icon-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: none;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.2rem;
            transition: all 0.2s;
            color: #fff;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
        }
        .icon-btn:active {
            transform: scale(0.9);
            background: rgba(255, 255, 255, 0.15);
        }

        /* ===== BOTTOM NAVIGATION ===== */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: calc(var(--bottom-nav-height) + var(--safe-bottom));
            background: rgba(26, 26, 46, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding-bottom: var(--safe-bottom);
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.4);
            z-index: 100;
            border-top: 1px solid var(--glass-border);
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3px;
            background: none;
            border: none;
            color: #b0b0c8;
            font-size: 0.7rem;
            font-weight: 600;
            padding: 8px 16px;
            border-radius: 20px;
            transition: all 0.25s;
            cursor: pointer;
            font-family: var(--font);
            letter-spacing: 0.3px;
            min-width: 60px;
            position: relative;
        }
        .nav-item .nav-icon {
            font-size: 1.5rem;
            transition: transform 0.25s;
        }
        .nav-item.active {
            color: #fff;
            background: var(--gradient-primary);
            box-shadow: 0 4px 15px rgba(123, 92, 255, 0.4);
        }
        .nav-item.active .nav-icon {
            transform: scale(1.2);
        }
        .nav-item:active {
            transform: scale(0.92);
        }

        /* ===== MAIN CONTENT ===== */
        .main-content {
            flex: 1;
            padding: 16px 14px 20px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
        .page {
            display: none;
            animation: fadeSlide 0.3s ease;
        }
        .page.active {
            display: block;
        }
        @keyframes fadeSlide {
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===== CARDS DE ESTATÍSTICAS (DASHBOARD) ===== */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 18px;
        }
        .stat-card {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(12px);
            border-radius: var(--radius-sm);
            padding: 16px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
            display: flex;
            align-items: center;
            gap: 14px;
            transition: all 0.25s;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
        }
        .stat-card:active {
            transform: scale(0.96);
        }
        .stat-card .stat-icon {
            width: 44px;
            height: 44px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            flex-shrink: 0;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(5px);
        }
        .stat-card.card-total {
            background: linear-gradient(135deg, rgba(94, 96, 206, 0.3), rgba(123, 92, 255, 0.2));
        }
        .stat-card.card-active {
            background: linear-gradient(135deg, rgba(0, 184, 148, 0.25), rgba(0, 214, 143, 0.15));
        }
        .stat-card.card-expired {
            background: linear-gradient(135deg, rgba(225, 112, 85, 0.3), rgba(255, 61, 113, 0.2));
        }
        .stat-card.card-revenue {
            background: linear-gradient(135deg, rgba(9, 132, 227, 0.25), rgba(0, 184, 217, 0.15));
        }
        .stat-info h3 {
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.7);
            text-transform: uppercase;
            letter-spacing: 0.6px;
            margin-bottom: 4px;
        }
        .stat-info .stat-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: #fff;
            line-height: 1.2;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
        }

        /* ===== LISTA DE VENCIMENTOS ===== */
        .upcoming-section {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(12px);
            border-radius: var(--radius);
            padding: 16px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .upcoming-section h3 {
            font-size: 0.95rem;
            margin-bottom: 14px;
            color: #fff;
            font-weight: 600;
        }
        .upcoming-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .upcoming-list li {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px;
            border-radius: var(--radius-sm);
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            font-size: 0.83rem;
            flex-wrap: wrap;
            gap: 6px;
            color: #e0e0e0;
            transition: all 0.2s;
        }
        .upcoming-list li .client-name {
            font-weight: 600;
            color: #fff;
        }
        .upcoming-list li.urgent {
            border-left: 4px solid var(--danger);
            background: rgba(255, 61, 113, 0.15);
            border-left-color: #ff3d71;
        }
        .upcoming-list li .due-date {
            font-size: 0.75rem;
            color: #b0b0c8;
        }

        /* ===== SEÇÃO CLIENTES (CARDS) ===== */
        .clients-wrapper {
            background: transparent;
            border-radius: var(--radius);
        }
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 12px 0;
            align-items: center;
            margin-bottom: 14px;
        }
        .search-box {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 8px 14px;
            flex: 1;
            min-width: 140px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.2s;
            color: #fff;
        }
        .search-box:focus-within {
            border-color: var(--primary-light);
            box-shadow: 0 0 0 3px rgba(123, 92, 255, 0.2);
        }
        .search-box input {
            border: none;
            background: transparent;
            outline: none;
            font-size: 0.85rem;
            width: 100%;
            font-family: var(--font);
            color: #fff;
        }
        .search-box input::placeholder {
            color: #aaa;
        }
        .filter-select {
            padding: 8px 12px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(5px);
            font-size: 0.8rem;
            font-family: var(--font);
            outline: none;
            color: #fff;
            max-width: 120px;
        }
        .filter-select option {
            background: #1a1a2e;
            color: #fff;
        }
        .sort-select {
            padding: 8px 12px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(5px);
            font-size: 0.8rem;
            font-family: var(--font);
            outline: none;
            color: #fff;
            max-width: 140px;
        }
        .sort-select option {
            background: #1a1a2e;
            color: #fff;
        }
        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.78rem;
            transition: all 0.2s;
            font-family: var(--font);
            display: inline-flex;
            align-items: center;
            gap: 5px;
            white-space: nowrap;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }
        .btn:active {
            transform: scale(0.94);
        }
        .btn-primary {
            background: var(--gradient-primary);
            color: #fff;
        }
        .btn-outline {
            background: transparent;
            color: #fff;
            border: 1.5px solid rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(5px);
        }
        .btn-success {
            background: var(--gradient-success);
            color: #fff;
        }
        .btn-warning {
            background: var(--gradient-warning);
            color: #1a1a2e;
        }
        .btn-danger {
            background: var(--gradient-danger);
            color: #fff;
        }
        .btn-sm {
            padding: 6px 12px;
            font-size: 0.7rem;
            border-radius: 14px;
        }

        /* ===== GRADE DE CARDS DE CLIENTES ===== */
        .clients-cards-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: center;
        }
        .client-card {
            width: 100%;
            max-width: 500px;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(14px);
            border-radius: var(--radius);
            padding: 18px 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 22px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            gap: 12px;
            transition: all 0.25s;
            color: #e0e0e0;
            position: relative;
            overflow: hidden;
        }
        .client-card:active {
            transform: scale(0.98);
        }
        /* Barra lateral colorida baseada no status */
        .client-card::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 4px;
            border-radius: 0 2px 2px 0;
        }
        .client-card.status-ativo::before {
            background: var(--gradient-success);
        }
        .client-card.status-vencido::before {
            background: var(--gradient-danger);
        }
        .client-card.status-pendente::before {
            background: var(--gradient-warning);
        }
        .client-card.status-cancelado::before {
            background: rgba(255, 255, 255, 0.2);
        }
        .client-card .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }
        .client-card .client-name-avatar {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
            min-width: 0;
        }
        .client-card .avatar-circle {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: var(--gradient-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.1rem;
            color: #fff;
            flex-shrink: 0;
            box-shadow: 0 4px 10px rgba(123, 92, 255, 0.4);
        }
        .client-card .client-name {
            font-weight: 700;
            font-size: 1rem;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .client-card .status-badge {
            flex-shrink: 0;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }
        .badge-ativo {
            background: rgba(0, 214, 143, 0.2);
            color: #00d68f;
            border: 1px solid rgba(0, 214, 143, 0.3);
        }
        .badge-vencido {
            background: rgba(255, 61, 113, 0.2);
            color: #ff3d71;
            border: 1px solid rgba(255, 61, 113, 0.3);
        }
        .badge-pendente {
            background: rgba(255, 170, 0, 0.2);
            color: #ffaa00;
            border: 1px solid rgba(255, 170, 0, 0.3);
        }
        .badge-cancelado {
            background: rgba(255, 255, 255, 0.1);
            color: #aaa;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .client-card .card-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px 14px;
            font-size: 0.8rem;
        }
        .client-card .info-item {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .client-card .info-label {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            color: #a0a0b8;
            font-weight: 600;
        }
        .client-card .info-value {
            color: #e0e0e0;
            font-weight: 500;
        }
        .client-card .info-value.highlight {
            color: #fff;
            font-weight: 700;
            font-size: 0.9rem;
        }
        .client-card .card-actions {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-top: 4px;
            flex-wrap: wrap;
        }
        .client-card .card-actions .btn {
            flex: 1;
            min-width: 60px;
            justify-content: center;
            font-size: 0.7rem;
            padding: 7px 10px;
        }

        .empty-state {
            text-align: center;
            padding: 40px 14px;
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.95rem;
            background: rgba(255, 255, 255, 0.04);
            border-radius: var(--radius);
            border: 1px solid rgba(255, 255, 255, 0.08);
            max-width: 400px;
            margin: 0 auto;
        }
        .empty-state .empty-icon {
            font-size: 3rem;
            margin-bottom: 10px;
        }

        /* ===== PLANOS ===== */
        .plans-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 14px;
            max-width: 500px;
            margin: 0 auto;
        }
        .plan-card {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(12px);
            border-radius: var(--radius);
            padding: 22px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            color: #fff;
            transition: transform 0.2s;
        }
        .plan-card:active {
            transform: scale(0.97);
        }
        .plan-card h4 {
            font-size: 1.1rem;
            margin-bottom: 8px;
            color: #fff;
        }
        .plan-card .plan-price {
            font-size: 2rem;
            font-weight: 700;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 6px 0;
        }
        .plan-card .plan-duration {
            color: #b0b0c8;
            font-size: 0.85rem;
            margin-bottom: 16px;
        }
        .plan-card .plan-actions {
            display: flex;
            gap: 8px;
            justify-content: center;
        }

        /* ===== MODAL ===== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
            z-index: 200;
            display: none;
            align-items: flex-end;
            justify-content: center;
        }
        .modal-overlay.show {
            display: flex;
        }
        .modal {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 24px 24px 0 0;
            box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 500px;
            max-height: 85vh;
            overflow-y: auto;
            animation: slideUp 0.35s ease;
            padding-bottom: var(--safe-bottom);
            color: var(--text-dark);
        }
        @keyframes slideUp {
            from {
                transform: translateY(100%);
            }
            to {
                transform: translateY(0);
            }
        }
        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
            position: sticky;
            top: 0;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            z-index: 1;
            border-radius: 24px 24px 0 0;
        }
        .modal-header h2 {
            font-size: 1.15rem;
            font-weight: 700;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .modal-close {
            background: none;
            border: none;
            font-size: 1.4rem;
            cursor: pointer;
            padding: 6px;
            border-radius: 50%;
            color: #555;
            transition: 0.2s;
        }
        .modal-close:active {
            background: rgba(0, 0, 0, 0.05);
        }
        .modal-body {
            padding: 18px;
        }
        .modal-body .form-group {
            margin-bottom: 14px;
        }
        .modal-body label {
            display: block;
            font-weight: 600;
            font-size: 0.75rem;
            margin-bottom: 5px;
            color: #444;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }
        .modal-body input,
        .modal-body select,
        .modal-body textarea {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid #ddd;
            border-radius: 12px;
            font-size: 0.9rem;
            font-family: var(--font);
            background: #f9f9fc;
            transition: all 0.2s;
            color: #1a1a2e;
        }
        .modal-body input:focus,
        .modal-body select:focus,
        .modal-body textarea:focus {
            outline: none;
            border-color: var(--primary-light);
            box-shadow: 0 0 0 3px rgba(123, 92, 255, 0.15);
            background: #fff;
        }
        .form-row {
            display: flex;
            gap: 10px;
        }
        .form-row .form-group {
            flex: 1;
        }
        .modal-footer {
            padding: 14px 18px;
            border-top: 1px solid rgba(0, 0, 0, 0.08);
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            position: sticky;
            bottom: 0;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 0 0 24px 24px;
        }
        @media (min-width: 500px) {
            .modal-overlay {
                align-items: center;
            }
            .modal {
                border-radius: 24px;
                margin: 0 16px;
            }
        }

        /* ===== TOAST ===== */
        .toast-container {
            position: fixed;
            top: 70px;
            right: 14px;
            z-index: 300;
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: none;
        }
        .toast {
            padding: 10px 20px;
            border-radius: 24px;
            color: #fff;
            font-weight: 600;
            font-size: 0.82rem;
            animation: toastIn 0.35s ease, toastOut 0.3s ease 2.5s forwards;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            max-width: 280px;
            pointer-events: auto;
            backdrop-filter: blur(10px);
        }
        .toast.toast-success {
            background: var(--gradient-success);
        }
        .toast.toast-error {
            background: var(--gradient-danger);
        }
        @keyframes toastIn {
            from {
                transform: translateX(120%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
        @keyframes toastOut {
            from {
                transform: translateX(0);
                opacity: 1;
            }
            to {
                transform: translateX(120%);
                opacity: 0;
            }
        }

        /* ===== SETTINGS MODAL ===== */
        .settings-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .settings-list li button {
            width: 100%;
            text-align: left;
            padding: 14px 16px;
            border: none;
            background: rgba(0, 0, 0, 0.03);
            border-radius: 14px;
            font-family: var(--font);
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 500;
            color: #1a1a2e;
            transition: 0.2s;
        }
        .settings-list li button:active {
            background: rgba(123, 92, 255, 0.1);
        }
        .settings-list li button.danger {
            color: #ff3d71;
        }
    </style>
</head>
<body>

    <!-- ========== HEADER ========== -->
    <header class="header" id="header">
        <span class="page-title" id="headerTitle">📊 Dashboard</span>
        <div class="header-actions">
            <button class="icon-btn" id="btnSettings" title="Ações">⚙️</button>
        </div>
    </header>

    <!-- ========== MAIN CONTENT ========== -->
    <main class="main-content" id="mainContent">
        <!-- Dashboard -->
        <section class="page active" id="page-dashboard">
            <div class="stats-grid" id="statsGrid"></div>
            <div class="upcoming-section">
                <h3>🔔 Vencimentos em 7 dias</h3>
                <ul class="upcoming-list" id="upcomingList"></ul>
            </div>
        </section>

        <!-- Clientes -->
        <section class="page" id="page-clientes">
            <div class="clients-wrapper">
                <div class="toolbar">
                    <div class="search-box">
                        <span>🔍</span>
                        <input type="text" id="searchInput" placeholder="Buscar cliente...">
                    </div>
                    <select class="filter-select" id="filterStatus">
                        <option value="todos">Todos</option>
                        <option value="Ativo">Ativos</option>
                        <option value="Vencido">Vencidos</option>
                        <option value="Pendente">Pendentes</option>
                        <option value="Cancelado">Cancelados</option>
                    </select>
                    <select class="sort-select" id="sortSelect">
                        <option value="nome">Nome A-Z</option>
                        <option value="data_vencimento">Vencimento</option>
                        <option value="valor">Valor</option>
                        <option value="status">Status</option>
                    </select>
                    <button class="btn btn-primary btn-sm" id="btnAddClient">➕ Novo</button>
                </div>
                <div class="clients-cards-grid" id="clientsCardsGrid"></div>
                <div class="empty-state" id="emptyState" style="display:none;">
                    <div class="empty-icon">📭</div>
                    <p>Nenhum cliente encontrado</p>
                    <button class="btn btn-primary btn-sm" style="margin-top:10px;" id="btnEmptyAdd">➕ Adicionar cliente</button>
                </div>
            </div>
        </section>

        <!-- Planos -->
        <section class="page" id="page-planos">
            <button class="btn btn-primary" id="btnAddPlan" style="margin-bottom:14px; display:block; margin-left:auto; margin-right:auto; max-width:200px;">➕ Novo Plano</button>
            <div class="plans-grid" id="plansGrid"></div>
        </section>
    </main>

    <!-- ========== BOTTOM NAVIGATION ========== -->
    <nav class="bottom-nav" id="bottomNav">
        <button class="nav-item active" data-page="dashboard">
            <span class="nav-icon">📊</span> Início
        </button>
        <button class="nav-item" data-page="clientes">
            <span class="nav-icon">👥</span> Clientes
        </button>
        <button class="nav-item" data-page="planos">
            <span class="nav-icon">📦</span> Planos
        </button>
    </nav>

    <!-- ========== MODAL CLIENTE ========== -->
    <div class="modal-overlay" id="modalClientOverlay">
        <div class="modal">
            <div class="modal-header">
                <h2 id="modalClientTitle">Novo Cliente</h2>
                <button class="modal-close" id="modalClientClose">✕</button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="clientId">
                <div class="form-group"><label>Nome *</label><input type="text" id="clientNome" placeholder="Nome completo"></div>
                <div class="form-row">
                    <div class="form-group"><label>WhatsApp</label><input type="text" id="clientTelefone" placeholder="(11) 9..."></div>
                    <div class="form-group"><label>Email</label><input type="email" id="clientEmail" placeholder="email@..."></div>
                </div>
                <div class="form-row">
                    <div class="form-group"><label>Plano *</label><select id="clientPlano"></select></div>
                    <div class="form-group"><label>Valor R$ *</label><input type="number" id="clientValor" step="0.01" min="0"></div>
                </div>
                <div class="form-row">
                    <div class="form-group"><label>Início</label><input type="date" id="clientDataInicio"></div>
                    <div class="form-group"><label>Vencimento *</label><input type="date" id="clientDataVencimento"></div>
                </div>
                <div class="form-group"><label>Status</label><select id="clientStatus"><option>Ativo</option><option>Pendente</option><option>Vencido</option><option>Cancelado</option></select></div>
                <div class="form-group"><label>Obs</label><textarea id="clientObs" rows="2"></textarea></div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-outline btn-sm" id="modalClientCancel" style="color:#1a1a2e; border-color:#ccc;">Cancelar</button>
                <button class="btn btn-primary btn-sm" id="modalClientSave">💾 Salvar</button>
            </div>
        </div>
    </div>

    <!-- ========== MODAL PLANO ========== -->
    <div class="modal-overlay" id="modalPlanOverlay">
        <div class="modal">
            <div class="modal-header">
                <h2 id="modalPlanTitle">Novo Plano</h2>
                <button class="modal-close" id="modalPlanClose">✕</button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="planId">
                <div class="form-group"><label>Nome *</label><input type="text" id="planNome" placeholder="Mensal, Trimestral..."></div>
                <div class="form-row">
                    <div class="form-group"><label>Meses *</label><input type="number" id="planDuracao" min="1"></div>
                    <div class="form-group"><label>Valor R$ *</label><input type="number" id="planValor" step="0.01" min="0"></div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-outline btn-sm" id="modalPlanCancel" style="color:#1a1a2e; border-color:#ccc;">Cancelar</button>
                <button class="btn btn-primary btn-sm" id="modalPlanSave">💾 Salvar</button>
            </div>
        </div>
    </div>

    <!-- ========== MODAL CONFIGURAÇÕES ========== -->
    <div class="modal-overlay" id="modalSettingsOverlay">
        <div class="modal">
            <div class="modal-header">
                <h2>⚙️ Ações</h2>
                <button class="modal-close" id="modalSettingsClose">✕</button>
            </div>
            <div class="modal-body">
                <ul class="settings-list">
                    <li><button id="btnExportBackup">📥 Exportar Backup</button></li>
                    <li><button id="btnImportBackup">📤 Restaurar Backup</button></li>
                    <input type="file" id="importFile" accept=".json" style="display:none;">
                    <li><button id="btnResetData" class="danger">🗑️ Resetar Dados</button></li>
                </ul>
            </div>
        </div>
    </div>

    <!-- ========== TOAST CONTAINER ========== -->
    <div class="toast-container" id="toastContainer"></div>

    <script>
        (function() {
            const STORAGE_KEY_CLIENTS = 'iptv_mobile_clients';
            const STORAGE_KEY_PLANS = 'iptv_mobile_plans';
            const defaultPlans = [
                { id: 'plan_001', nome: 'Mensal', duracao_meses: 1, valor: 29.90 },
                { id: 'plan_002', nome: 'Trimestral', duracao_meses: 3, valor: 79.90 },
                { id: 'plan_003', nome: 'Semestral', duracao_meses: 6, valor: 149.90 },
                { id: 'plan_004', nome: 'Anual', duracao_meses: 12, valor: 249.90 }
            ];

            function getDefaultClients() {
                const t = new Date();
                const d = o => { const dt = new Date(t); dt.setDate(dt.getDate() + o); return dt.toISOString().split(
                    'T')[0]; };
                return [
                    { id: 'c1', nome: 'Carlos Silva', telefone: '(11)98765-4321', email: 'carlos@email.com',
                        plano_id: 'plan_001', valor: 29.90, data_inicio: d(-60), data_vencimento: d(5),
                        status: 'Ativo', observacoes: '' },
                    { id: 'c2', nome: 'Maria Souza', telefone: '(21)97654-3210', email: 'maria@email.com',
                        plano_id: 'plan_002', valor: 79.90, data_inicio: d(-90), data_vencimento: d(-3),
                        status: 'Vencido', observacoes: 'Cobrar' },
                    { id: 'c3', nome: 'José Lima', telefone: '(31)96543-2109', email: 'jose@email.com',
                        plano_id: 'plan_003', valor: 149.90, data_inicio: d(-180), data_vencimento: d(1),
                        status: 'Ativo', observacoes: '' },
                    { id: 'c4', nome: 'Ana Oliveira', telefone: '(41)95432-1098', email: 'ana@email.com',
                        plano_id: 'plan_001', valor: 29.90, data_inicio: d(-30), data_vencimento: d(-10),
                        status: 'Vencido', observacoes: 'WhatsApp' },
                    { id: 'c5', nome: 'Fernando Costa', telefone: '(51)94321-0987', email: 'fernando@email.com',
                        plano_id: 'plan_004', valor: 249.90, data_inicio: d(-365), data_vencimento: d(15),
                        status: 'Ativo', observacoes: 'VIP' },
                    { id: 'c6', nome: 'Patrícia Nunes', telefone: '(61)93210-9876', email: 'patricia@email.com',
                        plano_id: 'plan_001', valor: 29.90, data_inicio: d(-45), data_vencimento: d(2),
                        status: 'Pendente', observacoes: '' }
                ];
            }

            let clients = JSON.parse(localStorage.getItem(STORAGE_KEY_CLIENTS)) || getDefaultClients();
            let plans = JSON.parse(localStorage.getItem(STORAGE_KEY_PLANS)) || defaultPlans;
            let currentSort = { field: 'nome', order: 'asc' };

            function save() { localStorage.setItem(STORAGE_KEY_CLIENTS, JSON.stringify(clients));
                localStorage.setItem(STORAGE_KEY_PLANS, JSON.stringify(plans)); }

            function refreshStatus() { clients.forEach(c => { if (c.status !== 'Cancelado') c.status = calcStatus(
                    c); });
                save(); }

            function calcStatus(c) { const days = daysUntil(c.data_vencimento); if (days < 0) return 'Vencido'; if (days <=
                    3) return 'Pendente'; return 'Ativo'; }

            function daysUntil(d) { const t = new Date(d + 'T00:00:00'); const n = new Date();
                n.setHours(0, 0, 0, 0); return Math.ceil((t - n) / 86400000); }

            function addMonths(d, m) { const dt = new Date(d + 'T00:00:00');
                dt.setMonth(dt.getMonth() + m); return dt.toISOString().split('T')[0]; }
            const todayISO = () => new Date().toISOString().split('T')[0];
            const fmtDate = d => d ? d.split('-').reverse().join('/') : '—';
            const fmtMoney = v => 'R$ ' + parseFloat(v).toFixed(2).replace('.', ',');

            function getPlan(id) { return plans.find(p => p.id === id) || null; }

            function showToast(msg, type = 'success') {
                const c = document.getElementById('toastContainer');
                const t = document.createElement('div');
                t.className = `toast toast-${type}`;
                t.textContent = msg;
                c.appendChild(t);
                setTimeout(() => t.remove(), 2800);
            }

            function setPage(page) {
                document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
                document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
                const pg = document.getElementById('page-' + page);
                const nav = document.querySelector(`.nav-item[data-page="${page}"]`);
                if (pg) pg.classList.add('active');
                if (nav) nav.classList.add('active');
                document.getElementById('headerTitle').innerHTML = page === 'dashboard' ? '📊 Dashboard' : page ===
                    'clientes' ? '👥 Clientes' : '📦 Planos';
                if (page === 'dashboard') renderDashboard();
                if (page === 'clientes') renderClientes();
                if (page === 'planos') renderPlanos();
            }

            function renderDashboard() {
                refreshStatus();
                const total = clients.length;
                const ativos = clients.filter(c => c.status === 'Ativo').length;
                const vencidos = clients.filter(c => c.status === 'Vencido').length;
                const receita = clients.filter(c => c.status !== 'Cancelado').reduce((s, c) => s + parseFloat(c.valor ||
                    0), 0);
                document.getElementById('statsGrid').innerHTML = `
                    <div class="stat-card card-total"><div class="stat-icon">👥</div><div class="stat-info"><h3>Total</h3><div class="stat-value">${total}</div></div></div>
                    <div class="stat-card card-active"><div class="stat-icon">✅</div><div class="stat-info"><h3>Ativos</h3><div class="stat-value">${ativos}</div></div></div>
                    <div class="stat-card card-expired"><div class="stat-icon">⚠️</div><div class="stat-info"><h3>Vencidos</h3><div class="stat-value">${vencidos}</div></div></div>
                    <div class="stat-card card-revenue"><div class="stat-icon">💰</div><div class="stat-info"><h3>Receita</h3><div class="stat-value">${fmtMoney(receita)}</div></div></div>
                `;
                const upcoming = clients.filter(c => c.status !== 'Cancelado' && daysUntil(c.data_vencimento) >= 0 &&
                    daysUntil(c.data_vencimento) <= 7).sort((a, b) => daysUntil(a.data_vencimento) - daysUntil(b
                    .data_vencimento));
                const ul = document.getElementById('upcomingList');
                ul.innerHTML = upcoming.length ? upcoming.map(c => {
                    const days = daysUntil(c.data_vencimento);
                    const urg = days <= 2 ? 'urgent' : '';
                    const lbl = days === 0 ? '🏃 Hoje' : days === 1 ? '🔴 Amanhã' : `em ${days} dias`;
                    return `<li class="${urg}"><span class="client-name">${c.nome}</span><span>${fmtMoney(c.valor)}</span><span class="due-date">📅 ${fmtDate(c.data_vencimento)} <strong>${lbl}</strong></span></li>`;
                }).join('') : '<li style="text-align:center;justify-content:center;">✅ Nenhum vencimento próximo</li>';
            }

            // ==================== CLIENTES EM CARDS ====================
            function renderClientes() {
                refreshStatus();
                const search = (document.getElementById('searchInput')?.value || '').toLowerCase();
                const statusF = document.getElementById('filterStatus')?.value || 'todos';
                let list = [...clients];
                if (search) list = list.filter(c => c.nome.toLowerCase().includes(search) || (c.telefone || '')
                    .includes(search) || (c.email || '').toLowerCase().includes(search));
                if (statusF !== 'todos') list = list.filter(c => c.status === statusF);

                // Ordenação
                const sortField = currentSort.field;
                const sortOrder = currentSort.order;
                list.sort((a, b) => {
                    let va, vb;
                    switch (sortField) {
                        case 'nome':
                            va = a.nome.toLowerCase();
                            vb = b.nome.toLowerCase();
                            break;
                        case 'data_vencimento':
                            va = a.data_vencimento || '';
                            vb = b.data_vencimento || '';
                            break;
                        case 'valor':
                            va = parseFloat(a.valor) || 0;
                            vb = parseFloat(b.valor) || 0;
                            break;
                        case 'status':
                            va = a.status || '';
                            vb = b.status || '';
                            break;
                        default:
                            va = a.nome.toLowerCase();
                            vb = b.nome.toLowerCase();
                    }
                    if (va < vb) return sortOrder === 'asc' ? -1 : 1;
                    if (va > vb) return sortOrder === 'asc' ? 1 : -1;
                    return 0;
                });

                const grid = document.getElementById('clientsCardsGrid');
                const empty = document.getElementById('emptyState');

                if (list.length === 0) {
                    grid.innerHTML = '';
                    empty.style.display = 'block';
                } else {
                    empty.style.display = 'none';
                    grid.innerHTML = list.map(c => {
                        const statusClass = `status-${c.status.toLowerCase()}`;
                        const badgeClass = c.status === 'Ativo' ? 'badge-ativo' : c.status === 'Vencido' ?
                            'badge-vencido' : c.status === 'Pendente' ? 'badge-pendente' :
                            'badge-cancelado';
                        const initials = c.nome.split(' ').map(w => w[0]).slice(0, 2).join('')
                            .toUpperCase();
                        const daysLeft = daysUntil(c.data_vencimento);
                        const vencimentoDisplay = c.status === 'Cancelado' ? '—' : fmtDate(c
                            .data_vencimento) +
                            (daysLeft >= 0 ? ` (${daysLeft}d)` : ` vencido`);
                        return `
                            <div class="client-card ${statusClass}">
                                <div class="card-header">
                                    <div class="client-name-avatar">
                                        <div class="avatar-circle">${initials}</div>
                                        <div class="client-name">${c.nome}</div>
                                    </div>
                                    <span class="status-badge ${badgeClass}">${c.status}</span>
                                </div>
                                <div class="card-info">
                                    <div class="info-item">
                                        <span class="info-label">📞 Telefone</span>
                                        <span class="info-value">${c.telefone || '—'}</span>
                                    </div>
                                    <div class="info-item">
                                        <span class="info-label">📧 Email</span>
                                        <span class="info-value">${c.email || '—'}</span>
                                    </div>
                                    <div class="info-item">
                                        <span class="info-label">📦 Plano</span>
                                        <span class="info-value">${c.plano_nome || '—'}</span>
                                    </div>
                                    <div class="info-item">
                                        <span class="info-label">💰 Valor</span>
                                        <span class="info-value highlight">${fmtMoney(c.valor)}</span>
                                    </div>
                                    <div class="info-item">
                                        <span class="info-label">📅 Vencimento</span>
                                        <span class="info-value">${vencimentoDisplay}</span>
                                    </div>
                                    <div class="info-item">
                                        <span class="info-label">📝 Obs</span>
                                        <span class="info-value">${c.observacoes || '—'}</span>
                                    </div>
                                </div>
                                <div class="card-actions">
                                    <button class="btn btn-success btn-sm" data-renew="${c.id}">🔄 Renovar</button>
                                    <button class="btn btn-warning btn-sm" data-edit="${c.id}">✏️ Editar</button>
                                    <button class="btn btn-danger btn-sm" data-del="${c.id}">🗑️ Excluir</button>
                                </div>
                            </div>
                        `;
                    }).join('');

                    // Event listeners nos botões dos cards
                    grid.querySelectorAll('[data-renew]').forEach(b => b.onclick = () => renewClient(b.dataset
                        .renew));
                    grid.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => openClientModal(b.dataset
                        .edit));
                    grid.querySelectorAll('[data-del]').forEach(b => b.onclick = () => deleteClient(b.dataset.del));
                }
            }

            function renewClient(id) {
                const c = clients.find(x => x.id === id);
                if (!c) return;
                const plan = getPlan(c.plano_id);
                const months = plan ? plan.duracao_meses : 1;
                if (confirm(`Renovar ${c.nome} por +${months} mês(es)?`)) { c.data_vencimento = addMonths(c
                        .data_vencimento, months);
                    c.status = 'Ativo';
                    save();
                    renderClientes();
                    showToast('🔄 Assinatura renovada!'); }
            }

            function deleteClient(id) {
                const c = clients.find(x => x.id === id);
                if (!c) return;
                if (confirm(`Excluir ${c.nome}?`)) { clients = clients.filter(x => x.id !== id);
                    save();
                    renderClientes();
                    showToast('🗑️ Cliente removido', 'error'); }
            }

            // ==================== MODAL CLIENTE ====================
            function openClientModal(client = null) {
                const edit = !!client;
                document.getElementById('modalClientTitle').textContent = edit ? 'Editar Cliente' : 'Novo Cliente';
                document.getElementById('clientId').value = client?.id || '';
                document.getElementById('clientNome').value = client?.nome || '';
                document.getElementById('clientTelefone').value = client?.telefone || '';
                document.getElementById('clientEmail').value = client?.email || '';
                document.getElementById('clientValor').value = client?.valor || '';
                document.getElementById('clientDataInicio').value = client?.data_inicio || todayISO();
                document.getElementById('clientDataVencimento').value = client?.data_vencimento || todayISO();
                document.getElementById('clientStatus').value = client?.status || 'Ativo';
                document.getElementById('clientObs').value = client?.observacoes || '';
                const sel = document.getElementById('clientPlano');
                sel.innerHTML = plans.map(p =>
                    `<option value="${p.id}" ${client?.plano_id===p.id?'selected':''}>${p.nome} (${p.duracao_meses}m)</option>`
                    ).join('');
                if (!edit && plans.length) document.getElementById('clientValor').value = plans[0].valor;
                sel.onchange = () => { const p = getPlan(sel.value); if (p && !edit) document.getElementById(
                        'clientValor').value = p.valor; };
                document.getElementById('modalClientOverlay').classList.add('show');
            }

            function closeClientModal() { document.getElementById('modalClientOverlay').classList.remove('show'); }

            function saveClient() {
                const id = document.getElementById('clientId').value;
                const nome = document.getElementById('clientNome').value.trim();
                const plano_id = document.getElementById('clientPlano').value;
                const valor = parseFloat(document.getElementById('clientValor').value) || 0;
                const venc = document.getElementById('clientDataVencimento').value;
                if (!nome || !plano_id || !venc) return showToast('Preencha nome, plano e vencimento', 'error');
                const plan = getPlan(plano_id);
                const obj = { id: id || 'c_' + Date.now(), nome, telefone: document.getElementById('clientTelefone')
                        .value, email: document.getElementById('clientEmail').value, plano_id, plano_nome: plan?.nome ||
                        '', valor, data_inicio: document.getElementById('clientDataInicio').value,
                    data_vencimento: venc, status: document.getElementById('clientStatus').value, observacoes: document
                        .getElementById('clientObs').value };
                obj.status = calcStatus(obj);
                if (id) { const idx = clients.findIndex(c => c.id === id); if (idx >= 0) clients[idx] = obj; } else clients
                    .push(obj);
                save();
                closeClientModal();
                renderClientes();
                showToast('✅ Cliente salvo!');
            }

            // ==================== PLANOS ====================
            function renderPlanos() {
                const grid = document.getElementById('plansGrid');
                grid.innerHTML = plans.map(p => `
                    <div class="plan-card"><h4>${p.nome}</h4><div class="plan-price">${fmtMoney(p.valor)}</div><div class="plan-duration">${p.duracao_meses} mês(es)</div><div class="plan-actions"><button class="btn btn-warning btn-sm" data-editplan="${p.id}">✏️</button><button class="btn btn-danger btn-sm" data-delplan="${p.id}">🗑️</button></div></div>
                `).join('');
                grid.querySelectorAll('[data-editplan]').forEach(b => b.onclick = () => openPlanModal(b.dataset
                .editplan));
                grid.querySelectorAll('[data-delplan]').forEach(b => b.onclick = () => {
                    const id = b.dataset.delplan;
                    if (clients.some(c => c.plano_id === id)) return showToast('Plano em uso', 'error');
                    if (confirm('Excluir plano?')) { plans = plans.filter(p => p.id !== id);
                        save();
                        renderPlanos();
                        showToast('Plano removido', 'error'); }
                });
            }

            function openPlanModal(plan = null) {
                document.getElementById('modalPlanTitle').textContent = plan ? 'Editar Plano' : 'Novo Plano';
                document.getElementById('planId').value = plan?.id || '';
                document.getElementById('planNome').value = plan?.nome || '';
                document.getElementById('planDuracao').value = plan?.duracao_meses || '';
                document.getElementById('planValor').value = plan?.valor || '';
                document.getElementById('modalPlanOverlay').classList.add('show');
            }

            function closePlanModal() { document.getElementById('modalPlanOverlay').classList.remove('show'); }

            function savePlan() {
                const id = document.getElementById('planId').value;
                const nome = document.getElementById('planNome').value.trim();
                const dur = parseInt(document.getElementById('planDuracao').value) || 1;
                const val = parseFloat(document.getElementById('planValor').value) || 0;
                if (!nome || val <= 0) return showToast('Preencha corretamente', 'error');
                if (id) { const idx = plans.findIndex(p => p.id === id); if (idx >= 0) plans[idx] = { ...plans[idx],
                        nome, duracao_meses: dur, valor: val }; } else plans.push({ id: 'plan_' + Date.now(),
                    nome, duracao_meses: dur, valor: val });
                save();
                closePlanModal();
                renderPlanos();
                renderClientes();
                showToast('✅ Plano salvo!');
            }

            // ==================== SETTINGS ====================
            function openSettings() { document.getElementById('modalSettingsOverlay').classList.add('show'); }

            function closeSettings() { document.getElementById('modalSettingsOverlay').classList.remove('show'); }

            function exportBackup() {
                const data = { clients, plans, date: new Date().toISOString() };
                const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = 'iptv_backup.json';
                a.click();
                showToast('📥 Backup salvo');
            }

            function importBackup(file) {
                const reader = new FileReader();
                reader.onload = e => {
                    try { const data = JSON.parse(e.target.result); if (!data.clients || !data.plans) throw Error(); if (
                            confirm('Restaurar backup? Dados atuais serão substituídos.')) { clients = data.clients;
                            plans = data.plans;
                            save();
                            setPage('dashboard');
                            showToast('✅ Dados restaurados'); } } catch { showToast('Arquivo inválido', 'error'); }
                };
                reader.readAsText(file);
            }

            // ==================== EVENTOS ====================
            document.querySelectorAll('.nav-item').forEach(b => b.addEventListener('click', () => setPage(b.dataset
                .page)));
            document.getElementById('btnSettings').addEventListener('click', openSettings);
            document.getElementById('modalSettingsClose').addEventListener('click', closeSettings);
            document.getElementById('modalSettingsOverlay').addEventListener('click', e => { if (e.target === document
                    .getElementById('modalSettingsOverlay')) closeSettings(); });
            document.getElementById('btnExportBackup').addEventListener('click', exportBackup);
            document.getElementById('btnImportBackup').addEventListener('click', () => document.getElementById(
                'importFile').click());
            document.getElementById('importFile').addEventListener('change', function() { if (this.files[0])
                    importBackup(this.files[0]);
                this.value = ''; });
            document.getElementById('btnResetData').addEventListener('click', () => { if (confirm(
                    'Apagar TODOS os dados?')) { clients = [];
                    plans = defaultPlans;
                    save();
                    setPage('dashboard');
                    showToast('Dados resetados', 'error'); } });
            document.getElementById('btnAddClient').addEventListener('click', () => openClientModal());
            document.getElementById('btnEmptyAdd')?.addEventListener('click', () => openClientModal());
            document.getElementById('modalClientClose').addEventListener('click', closeClientModal);
            document.getElementById('modalClientCancel').addEventListener('click', closeClientModal);
            document.getElementById('modalClientSave').addEventListener('click', saveClient);
            document.getElementById('modalClientOverlay').addEventListener('click', e => { if (e.target === document
                    .getElementById('modalClientOverlay')) closeClientModal(); });
            document.getElementById('btnAddPlan').addEventListener('click', () => openPlanModal());
            document.getElementById('modalPlanClose').addEventListener('click', closePlanModal);
            document.getElementById('modalPlanCancel').addEventListener('click', closePlanModal);
            document.getElementById('modalPlanSave').addEventListener('click', savePlan);
            document.getElementById('modalPlanOverlay').addEventListener('click', e => { if (e.target === document
                    .getElementById('modalPlanOverlay')) closePlanModal(); });
            document.getElementById('searchInput').addEventListener('input', renderClientes);
            document.getElementById('filterStatus').addEventListener('change', renderClientes);
            document.getElementById('sortSelect').addEventListener('change', function() {
                const val = this.value;
                currentSort.field = val;
                currentSort.order = val === 'nome' ? 'asc' : 'asc';
                renderClientes();
            });
            document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeClientModal();
                    closePlanModal();
                    closeSettings(); } });

            // PWA manifest
            (function() {
                const manifest = { name: 'IPTV Manager', short_name: 'IPTV', start_url: location.href,
                    display: 'standalone', background_color: '#1a1a2e', theme_color: '#1a1a2e', icons: [{ src: 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAADAAAAAwCAYAAABXAvmHAAAACXBIWXMAAAsTAAALEwEAmpwYAAAB+klEQVR4nO2ZvUoDQRSFJ2IjiCAoIoiFKFhYWFhY2NjY2NjY2NjY2NjY2PgAvoGgIAj6AD6AjYWFhYWFhYWFhY2FhYWFhYWFhYXF+Y7sLCb7M7nJJnvvgeGSmZkzZ2buzOwPkUgkEolEIpFIJBKJRCIMAH4BLoAfgGvgbQfQCegGbgP3gPvAA+AxcBFwnRNwBegD7gEPgE+Bt4D37wI7gdvA28BzwGPgK7nvcwA2gDPAjcAF4D7gM+AVoLu2yTwDThC2CNUx5QGwI3AI+AQ4AnQUWANQ5nUrX9NAkQNwWDvCAgQo9HnGPBOEnoE4d+Y5Q7TwO0L9F/gEfFyB1wHKIP2HEGOoNY8NWH9SC4DF5CbwPvAJmX37CPRBjNPALBd/iFjMbvIV+Hiv+hyjL3m+9HMGFlOHqXtIM/2AVsP3p3U5UFQYb6uOeV8FowzwHpguxTlvT+CsRAb2kwsb2QAfgEVg6QD6I0lOpQwcJEKZr3SAiWTRkIFJYDwxqgFoiKpAdACLSWHk4b9IB2gBfAC+EeScIVpqIQuYgfM3wFcKr56T1EUkOyN5ClnYyQAnwEK5gbRFQHjN1C+zQ3oQ/Ms/0J6KscqA4jVXgOE8/BXF+C3jFJFz7gQIR2y+UoEeFAr19vDtM9AnhB5BeqPfKXmVMqA8lOJrO7h5Vv5xHxKJRCL5AfAN/AN83f+T/wIAAAAASUVORK5CYII=',
                            sizes: '192x192', type: 'image/png'
                        }] };
                const blob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
                const link = document.createElement('link');
                link.rel = 'manifest';
                link.href = URL.createObjectURL(blob);
                document.head.appendChild(link);
            })();

            // Inicializa
            clients.forEach(c => { if (!c.plano_nome) { const p = getPlan(c.plano_id);
                    c.plano_nome = p ? p.nome : '—'; } });
            refreshStatus();
            setPage('dashboard');
            console.log('📱 IPTV Manager com Cards - Pronto!');
        })();
    </script>
</body>
</html>
